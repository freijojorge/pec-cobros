<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1117"><title>GestiónPréstamos</title>
  <script>window.APP_VERSION = 9;</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #0f1117;
  --bg2: #171921;
  --bg3: #1e2130;
  --card: #1a1d2e;
  --border: #2a2d3e;
  --accent: #00d4aa;
  --accent2: #7c6af7;
  --danger: #ff4d6d;
  --warn: #ffaa00;
  --success: #00d4aa;
  --text: #e8eaf0;
  --text2: #8890a4;
  --text3: #555d72;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { font-size: 16px; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
  overflow-x: hidden;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ===== LOGIN ===== */
#login-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  background: radial-gradient(ellipse at 50% 0%, rgba(0,212,170,0.12) 0%, transparent 60%),
              var(--bg);
}

.login-logo {
  width: 72px;
  height: 72px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin-bottom: 24px;
  box-shadow: 0 8px 32px rgba(0,212,170,0.3);
}

.login-title { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
.login-sub { color: var(--text2); font-size: 14px; margin-bottom: 40px; }

.login-form { width: 100%; max-width: 340px; }

/* ===== INPUTS ===== */
.input-group { margin-bottom: 16px; }
.input-label { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; display: block; }

input, select, textarea {
  width: 100%;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  padding: 13px 16px;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
}

select option { background: var(--bg3); }

textarea { resize: vertical; min-height: 80px; }

/* ===== BUTTONS ===== */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 15px 20px;
  border: none;
  border-radius: var(--radius-sm);
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
}

.btn:active { transform: scale(0.97); }

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #00b894);
  color: #0f1117;
}

.btn-secondary {
  background: var(--bg3);
  color: var(--text);
  border: 1.5px solid var(--border);
}

.btn-danger {
  background: rgba(255,77,109,0.15);
  color: var(--danger);
  border: 1.5px solid rgba(255,77,109,0.3);
}

.btn-warn {
  background: rgba(255,170,0,0.15);
  color: var(--warn);
  border: 1.5px solid rgba(255,170,0,0.3);
}

.btn-accent2 {
  background: rgba(124,106,247,0.15);
  color: var(--accent2);
  border: 1.5px solid rgba(124,106,247,0.3);
}

.btn-sm {
  padding: 8px 14px;
  font-size: 13px;
  width: auto;
}

.btn-icon {
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 10px;
  font-size: 18px;
}

/* ===== HEADER ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(15,17,23,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.header-back {
  width: 36px; height: 36px;
  background: var(--bg3);
  border: none;
  border-radius: 10px;
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.header-title { font-size: 17px; font-weight: 600; flex: 1; }
.header-sub { font-size: 12px; color: var(--text2); }

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: rgba(26,29,46,0.97);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom);
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 4px;
  border: none;
  background: none;
  color: var(--text3);
  font-family: var(--font);
  font-size: 10px;
  font-weight: 500;
  cursor: pointer;
  transition: color 0.2s;
  gap: 4px;
}

.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 22px; line-height: 1; }

/* ===== MAIN CONTENT ===== */
.main {
  padding: 16px 20px 100px;
}

/* ===== CARDS ===== */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.card-title { font-size: 13px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; }

/* ===== STATS ===== */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
}

.stat-label { font-size: 11px; color: var(--text2); font-weight: 500; margin-bottom: 6px; }
.stat-value { font-family: var(--mono); font-size: 20px; font-weight: 500; color: var(--text); }
.stat-value.accent { color: var(--accent); }
.stat-value.warn { color: var(--warn); }
.stat-value.danger { color: var(--danger); }

/* ===== CLIENTE ITEM ===== */
.cliente-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}

.cliente-item:active { background: var(--bg3); }

.cliente-avatar {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent2), var(--accent));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: white;
  flex-shrink: 0;
  font-family: var(--mono);
}

.cliente-info { flex: 1; min-width: 0; }
.cliente-nombre { font-size: 15px; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cliente-sub { font-size: 12px; color: var(--text2); }

.cliente-monto { text-align: right; flex-shrink: 0; }
.cliente-monto-hoy { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--accent); }
.cliente-deuda { font-size: 11px; color: var(--danger); font-weight: 500; }

.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.badge-green { background: rgba(0,212,170,0.15); color: var(--accent); }
.badge-red { background: rgba(255,77,109,0.15); color: var(--danger); }
.badge-warn { background: rgba(255,170,0,0.15); color: var(--warn); }
.badge-purple { background: rgba(124,106,247,0.15); color: var(--accent2); }

/* ===== PLAN CARD ===== */
.plan-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px;
  margin-bottom: 8px;
}

.plan-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.plan-nombre { font-size: 13px; font-weight: 600; color: var(--text2); }
.plan-capital { font-family: var(--mono); font-size: 18px; font-weight: 600; color: var(--text); }
.plan-cuota-info { font-size: 13px; color: var(--text2); }
.plan-cuota-num { font-family: var(--mono); font-weight: 600; color: var(--accent); }

.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--accent2), var(--accent));
  transition: width 0.4s ease;
}

/* ===== SEARCH ===== */
.search-bar {
  display: flex;
  align-items: center;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0 14px;
  margin-bottom: 16px;
  gap: 10px;
}

.search-bar input {
  border: none;
  background: none;
  padding: 13px 0;
  flex: 1;
}

.search-bar input:focus { border: none; }
.search-icon { color: var(--text3); font-size: 18px; }

/* ===== DIVIDER ===== */
.divider {
  height: 1px;
  background: var(--border);
  margin: 16px 0;
}

/* ===== SECTION TITLE ===== */
.section-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 20px 0 10px;
}

/* ===== TABS ===== */
.tabs {
  display: flex;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  padding: 4px;
  margin-bottom: 16px;
  gap: 2px;
}

.tab {
  flex: 1;
  padding: 9px 8px;
  border: none;
  border-radius: 6px;
  background: none;
  color: var(--text2);
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}

.tab.active {
  background: var(--card);
  color: var(--text);
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

/* ===== COBRO FORM ===== */
.cuota-check-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: var(--bg3);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 8px;
  cursor: pointer;
  transition: border-color 0.15s;
}

.cuota-check-item.checked { border-color: var(--accent); background: rgba(0,212,170,0.05); }
.cuota-check-item.vencida { border-color: rgba(255,77,109,0.4); }
.cuota-check-item.vencida.checked { border-color: var(--danger); background: rgba(255,77,109,0.05); }

.cuota-checkbox {
  width: 22px; height: 22px;
  border-radius: 6px;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-size: 13px;
  transition: all 0.15s;
}

.cuota-check-item.checked .cuota-checkbox { background: var(--accent); border-color: var(--accent); color: #0f1117; }
.cuota-check-item.vencida.checked .cuota-checkbox { background: var(--danger); border-color: var(--danger); color: white; }

.cuota-check-info { flex: 1; }
.cuota-check-label { font-size: 13px; font-weight: 500; }
.cuota-check-fecha { font-size: 11px; color: var(--text3); }
.cuota-check-monto { font-family: var(--mono); font-weight: 600; font-size: 14px; }

/* ===== RESUMEN BOX ===== */
.resumen-box {
  background: rgba(0,212,170,0.08);
  border: 1.5px solid rgba(0,212,170,0.25);
  border-radius: var(--radius-sm);
  padding: 16px;
  margin: 16px 0;
}

.resumen-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 0;
  font-size: 14px;
}

.resumen-row.total {
  border-top: 1px solid rgba(0,212,170,0.2);
  margin-top: 8px;
  padding-top: 12px;
  font-weight: 700;
  font-size: 16px;
}

.resumen-label { color: var(--text2); }
.resumen-value { font-family: var(--mono); font-weight: 500; }
.resumen-value.accent { color: var(--accent); }
.resumen-value.danger { color: var(--danger); }
.resumen-value.warn { color: var(--warn); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  z-index: 500;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding: 24px 20px 40px;
  width: 100%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 20px;
}

.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; }

/* ===== IMPUTACION RESULT ===== */
.imputacion-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.imputacion-item:last-child { border-bottom: none; }

.imputacion-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 6px;
  flex-shrink: 0;
}

.imputacion-dot.vencida { background: var(--danger); }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 500;
  z-index: 1000;
  animation: fadeInDown 0.2s ease, fadeOut 0.3s ease 2.7s forwards;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.toast.success { border-color: var(--accent); color: var(--accent); }
.toast.error { border-color: var(--danger); color: var(--danger); }

@keyframes fadeInDown { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text3);
}
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty-text { font-size: 15px; }

/* ===== RENOVACION ===== */
.renovacion-step {
  display: flex;
  gap: 12px;
  margin-bottom: 20px;
}

.step-num {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--accent2);
  color: white;
  font-size: 13px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ===== ADMIN DASHBOARD ===== */
.dash-section { margin-bottom: 24px; }
.dash-section-title {
  font-size: 11px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: 1.2px;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

.dash-section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.gasto-group {
  background: var(--bg3);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 6px;
}

.gasto-group-header {
  display: flex;
  justify-content: space-between;
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}

.gasto-group-fechas {
  padding: 0 14px 12px;
  font-size: 12px;
  color: var(--text2);
}

/* ===== FAB ===== */
.fab {
  position: fixed;
  bottom: 80px;
  right: 20px;
  width: 56px; height: 56px;
  background: linear-gradient(135deg, var(--accent), #00b894);
  border: none;
  border-radius: 16px;
  color: #0f1117;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,212,170,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 150;
  transition: transform 0.15s;
}
.fab:active { transform: scale(0.92); }

/* ===== RESPONSIVE DESKTOP ===== */
@media (min-width: 768px) {
  body { max-width: 100%; }
  .bottom-nav { max-width: 480px; }
  .fab { right: calc(50% - 220px); }
}
</style></head>
<body>
<div id="login-screen">
  <div class="login-logo">💰</div><h1 class="login-title">GestiónPréstamos</h1>
  <p class="login-sub">Sistema de préstamos diarios</p>
  <div class="login-form">
    <div class="input-group"><label class="input-label">Usuario</label><input type="text" id="login-user" placeholder="Ingresá tu usuario" autocomplete="username"></div>

</div>

  </div>
  <div class="main" id="main-content"></div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

  if (!parsed || !parsed.clientes || parsed.clientes.length === 0 || (parsed._seedVersion || 0) < SEED_VERSION) {
    if (typeof SEED_DATA !== 'undefined') {
      var seedCopy = JSON.parse(JSON.stringify(SEED_DATA));

      localStorage.setItem('prestamos_data', JSON.stringify(seedCopy));

  } else {
    var cierres = parsed.cierres || [];
    var ci = cierres.find(function(c) { return c.id === 'cierre_inicial_julieta'; });
    if (!ci) {
      cierres.push({id:'cierre_inicial_julieta',fecha:hoy,cartera:'julieta',cobrador:'Julieta',esSaldoInicial:true,saldoTeoricoEfectivo:557555,saldoTeoricoTransferencia:915400,saldoRealEfectivo:557555,saldoRealTransferencia:915400,diferenciaEfectivo:0,diferenciaTransferencia:0,saldoFinalEfectivo:557555,saldoFinalTransferencia:915400});
      parsed.cierres = cierres;

      ci.fecha = hoy;
      localStorage.setItem('prestamos_data', JSON.stringify(parsed));
    }
  }
})();

<script>// ============================================================
// SISTEMA DE GESTIÓN DE PRÉSTAMOS — CORE DATA & LOGIC
// ============================================================

// --- AUTH ---
const USERS = {
  admin: { password: 'admin123', role: 'admin', name: 'Jorge', cartera: 'jorge' },
  julieta: { password: 'juli123', role: 'cobrador', name: 'Julieta', cartera: 'julieta' },
  jorge_cobrador: { password: 'jorge123', role: 'cobrador', name: 'Jorge', cartera: 'jorge' }
};

// --- STATE ---
let state = {
  user: null,
  clientes: [],
  planes: [],
  cuotas: [],
  cobros: [],
  renovaciones: [],
  gastos: [],
  cierres: [],
  movimientosJorge: [],
  usuarios: []
};

// --- STORAGE ---
const save = () => {
  localStorage.setItem('prestamos_data', JSON.stringify({
    clientes: state.clientes,
    planes: state.planes,
    cuotas: state.cuotas,
    cobros: state.cobros,
    renovaciones: state.renovaciones,
    gastos: state.gastos,
    cierres: state.cierres,
    movimientosJorge: state.movimientosJorge,
    usuarios: state.usuarios
  }));
  // Sync a Firebase si está disponible
  if (window._syncToFirebase) window._syncToFirebase();
};

const load = () => {
  const d = localStorage.getItem('prestamos_data');
  if (d) {
    const parsed = JSON.parse(d);
    Object.assign(state, parsed);
  }
};

// --- ID GENERATOR ---
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// --- DATE UTILS ---
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset() - 180); return d.toISOString().slice(0, 10); };

const isHabil = (date, frecuencia) => {
  const d = new Date(date + 'T12:00:00');
  const day = d.getDay(); // 0=dom, 1=lun, ..., 6=sab
  if (frecuencia === 'LV') return day >= 1 && day <= 5;
  if (frecuencia === 'LS') return day >= 1 && day <= 6;
  if (frecuencia === 'semanal') return true; // cualquier día, el intervalo lo maneja generarCuotas
  if (frecuencia === 'quincenal') return true; // cualquier día, el intervalo lo maneja generarCuotas
  return true;
  // Nota: no se consideran feriados, se cobra igual
};

const nextHabil = (fromDate, frecuencia) => {
  let d = new Date(fromDate + 'T12:00:00');
  if (frecuencia === 'semanal') {
    // El primer cobro es al día siguiente hábil (lunes a viernes), manteniendo ese día de semana
    d.setDate(d.getDate() + 1);
    // Saltar fines de semana
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
  }
  if (frecuencia === 'quincenal') {
    // El primer cobro es al día siguiente hábil, manteniendo ese día de semana
    d.setDate(d.getDate() + 1);
    // Saltar fines de semana
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    return d.toISOString().slice(0, 10);
  }
  d.setDate(d.getDate() + 1);
  while (!isHabil(d.toISOString().slice(0, 10), frecuencia)) {
    d.setDate(d.getDate() + 1);
  }
  return d.toISOString().slice(0, 10);
};

const addDays = (date, n) => {
  const d = new Date(date + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0, 10);
};

const formatDate = (iso) => {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
};

const formatMoney = (n) => {
  if (n === undefined || n === null) return '$0';
  return '$' + Number(n).toLocaleString('es-AR');
};

const diffDays = (a, b) => {
  const da = new Date(a + 'T12:00:00');
  const db = new Date(b + 'T12:00:00');
  return Math.round((db - da) / 86400000);
};

// --- GENERAR CUOTAS DE UN PLAN ---
const generarCuotas = (plan) => {
  const cuotas = [];
  let fecha = plan.fechaInicio;
  const intervalo = plan.frecuencia === 'semanal' ? 7 : plan.frecuencia === 'quincenal' ? 14 : null;
  for (let i = 1; i <= plan.totalCuotas; i++) {
    // Para LV/LS buscar próximo día hábil; para semanal/quincenal la fecha ya es correcta
    if (!intervalo) {
      while (!isHabil(fecha, plan.frecuencia)) {
        fecha = addDays(fecha, 1);
      }
    }
    cuotas.push({
      id: uid(),
      planId: plan.id,
      clienteId: plan.clienteId,
      cartera: plan.cartera,
      numero: i,
      fecha: fecha,
      monto: plan.valorCuota,
      estado: 'pendiente', // pendiente | pagada | vencida
      cobradoEfectivo: 0,
      cobradoTransferencia: 0,
      interesMora: 0,
      fechaPago: null
    });
    if (intervalo) {
      // Semanal: +7 dias; Quincenal: +14 dias (mismo dia de la semana)
      fecha = addDays(fecha, intervalo);
    } else {
      fecha = addDays(fecha, 1);
      while (!isHabil(fecha, plan.frecuencia)) {
        fecha = addDays(fecha, 1);
      }
    }
  }
  return cuotas;
};

// --- LÓGICA DE COBRO (IMPUTACIÓN INTELIGENTE) ---
const imputarPago = (clienteId, montoPagado) => {
  const hoy = today();

  // Todas las cuotas pendientes/parciales ordenadas cronológicamente
  const cuotasPendientes = state.cuotas
    .filter(c => c.clienteId === clienteId && (c.estado === 'pendiente' || c.estado === 'parcial'))
    .sort((a, b) => a.fecha.localeCompare(b.fecha));

  const imputacion = [];
  let restante = montoPagado;

  for (const cuota of cuotasPendientes) {
    if (restante <= 0) break;
    const saldoCuota = cuota.saldoPendiente !== undefined ? cuota.saldoPendiente : cuota.monto;
    const aPagar = Math.min(restante, saldoCuota);
    imputacion.push({
      cuotaId: cuota.id,
      planId: cuota.planId,
      numeroCuota: cuota.numero,
      fecha: cuota.fecha,
      montoImputado: aPagar,
      saldoAnterior: saldoCuota,
      saldoRestante: saldoCuota - aPagar,
      parcial: aPagar < saldoCuota,
      vencida: cuota.fecha < hoy
    });
    restante -= aPagar;
  }

  return { imputacion, sobrante: restante };
};

// Aplicar imputación al estado
const aplicarImputacion = (clienteId, montoPagado, montoEfectivo, montoTransferencia, interesMora, registradoPor) => {
  const { imputacion, sobrante } = montoPagado > 0 ? imputarPago(clienteId, montoPagado) : { imputacion: [], sobrante: 0 };
  const hoy = today();
  const cartera = state.planes.find(p => p.clienteId === clienteId)?.cartera;

  if (montoPagado > 0) {
    imputacion.forEach(imp => {
      const cuota = state.cuotas.find(c => c.id === imp.cuotaId);
      if (cuota) {
        if (imp.parcial) {
          cuota.estado = 'parcial';
          cuota.saldoPendiente = imp.saldoRestante;
          cuota.montoPagado = (cuota.montoPagado || 0) + imp.montoImputado;
        } else {
          cuota.estado = 'pagada';
          cuota.fechaPago = hoy;
          cuota.saldoPendiente = 0;
          cuota.montoPagado = cuota.monto;
        }
        cuota.cobradoEfectivo = (cuota.cobradoEfectivo || 0) + montoEfectivo * (imp.montoImputado / montoPagado);
        cuota.cobradoTransferencia = (cuota.cobradoTransferencia || 0) + montoTransferencia * (imp.montoImputado / montoPagado);
      }
    });
  }

  const cobro = {
    id: uid(),
    clienteId,
    cartera,
    fecha: hoy,
    montoPagado,
    montoEfectivo,
    montoTransferencia,
    interesMora,
    sobrante,
    imputacion,
    registradoPor
  };
  state.cobros.push(cobro);

  verificarPlanesCancelados(clienteId);
  save();
  return cobro;
};

const verificarPlanesCancelados = (clienteId) => {
  const planes = state.planes.filter(p => p.clienteId === clienteId && p.estado === 'activo');
  planes.forEach(plan => {
    const cuotasPlan = state.cuotas.filter(c => c.planId === plan.id);
    const todasPagadas = cuotasPlan.every(c => c.estado === 'pagada');
    if (todasPagadas) {
      plan.estado = 'cancelado';
      plan.fechaCancelacion = today();
    }
  });
};

// --- LÓGICA DE RENOVACIÓN ---
const calcularRenovacion = (planIdARenovar, clienteId, nuevoCapital) => {
  const hoy = today();
  const planARenovar = state.planes.find(p => p.id === planIdARenovar);
  if (!planARenovar) return null;

  // Cuotas restantes del plan a renovar (todas las pendientes)
  const cuotasRestantes = state.cuotas.filter(
    c => c.planId === planIdARenovar && c.estado === 'pendiente'
  );
  const descuentoPlanRenovar = cuotasRestantes.reduce((s, c) => s + c.monto, 0);

  // Cuotas vencidas + cuota del día de los otros planes activos
  const otrosPlanes = state.planes.filter(
    p => p.clienteId === clienteId && p.estado === 'activo' && p.id !== planIdARenovar
  );

  const descuentosOtros = otrosPlanes.map(plan => {
    // Incluir cuotas vencidas + cuota de hoy
    const cuotasVencidas = state.cuotas.filter(
      c => c.planId === plan.id && c.estado === 'pendiente' && c.fecha < hoy
    );
    const cuotaHoy = state.cuotas.find(
      c => c.planId === plan.id && c.fecha === hoy && c.estado === 'pendiente'
    );
    const cuotasADescontar = [...cuotasVencidas, ...(cuotaHoy ? [cuotaHoy] : [])];
    const montoDescontar = cuotasADescontar.reduce((s, c) => s + c.monto, 0);
    return {
      planId: plan.id,
      capital: plan.capital,
      cuota: montoDescontar,
      cuotasIds: cuotasADescontar.map(c => c.id),
      detalle: cuotasVencidas.length > 0
        ? `${cuotasVencidas.length} vencidas + cuota hoy`
        : 'Cuota hoy'
    };
  }).filter(d => d.cuota > 0);

  const totalDescuentoOtros = descuentosOtros.reduce((s, d) => s + d.cuota, 0);
  const totalDescuento = descuentoPlanRenovar + totalDescuentoOtros;
  const netoEntregar = nuevoCapital - totalDescuento;

  // Desglose capital/ganancia de las cuotas descontadas
  let capitalDescontado = 0;
  let gananciaDescontada = 0;

  // Del plan que se renueva
  cuotasRestantes.forEach(c => {
    const capitalPorCuota = planARenovar.capital / planARenovar.totalCuotas;
    capitalDescontado += capitalPorCuota;
    gananciaDescontada += c.monto - capitalPorCuota;
  });

  // De los otros planes
  descuentosOtros.forEach(d => {
    const plan = state.planes.find(p => p.id === d.planId);
    if (plan) {
      d.cuotasIds.forEach(cuotaId => {
        const capitalPorCuota = plan.capital / plan.totalCuotas;
        capitalDescontado += capitalPorCuota;
        gananciaDescontada += (plan.valorCuota - capitalPorCuota);
      });
    }
  });

  return {
    planARenovar,
    cuotasRestantes: cuotasRestantes.length,
    cuotasRestantesIds: cuotasRestantes.map(c => c.id),
    descuentoPlanRenovar,
    otrosPlanes: descuentosOtros,
    totalDescuentoOtros,
    totalDescuento,
    netoEntregar,
    capitalDescontado,
    gananciaDescontada
  };
};

const confirmarRenovacion = (planIdARenovar, clienteId, nuevoCapital, nuevaCuota, frecuencia, registradoPor, totalCuotasOverride, efectivoEntregado, transferenciaEntregada) => {
  const calc = calcularRenovacion(planIdARenovar, clienteId, nuevoCapital);
  if (!calc) return null;

  const hoy = today();
  const inicio = nextHabil(hoy, frecuencia);
  const totalCuotas = totalCuotasOverride || Math.round(nuevoCapital / nuevaCuota);
  const cartera = calc.planARenovar.cartera;

  // Marcar plan viejo como renovado
  const planViejo = state.planes.find(p => p.id === planIdARenovar);
  planViejo.estado = 'renovado';
  planViejo.fechaRenovacion = hoy;

  // Marcar cuotas restantes del plan renovado como saldadas
  state.cuotas.forEach(c => {
    if (c.planId === planIdARenovar && c.estado === 'pendiente') {
      c.estado = 'saldada_renovacion';
      c.fechaPago = hoy;
    }
  });

  // Marcar cuotas de otros planes que se descontaron como saldadas
  calc.otrosPlanes.forEach(d => {
    d.cuotasIds.forEach(cuotaId => {
      const cuota = state.cuotas.find(c => c.id === cuotaId);
      if (cuota) {
        cuota.estado = 'saldada_renovacion';
        cuota.fechaPago = hoy;
      }
    });
  });

  // Registrar cobro virtual de las cuotas descontadas
  const cobroVirtual = {
    id: uid(),
    clienteId,
    cartera,
    fecha: hoy,
    montoPagado: calc.totalDescuento,
    montoEfectivo: 0,
    montoTransferencia: 0,
    montoVirtual: calc.totalDescuento,
    interesMora: 0,
    esVirtual: true,
    imputacion: [
      ...calc.cuotasRestantesIds.map(id => {
        const c = state.cuotas.find(q => q.id === id);
        return { cuotaId: id, planId: planIdARenovar, montoImputado: c?.monto || 0, vencida: c?.fecha < hoy };
      }),
      ...calc.otrosPlanes.flatMap(d => d.cuotasIds.map(id => {
        const c = state.cuotas.find(q => q.id === id);
        return { cuotaId: id, planId: d.planId, montoImputado: c?.monto || 0, vencida: c?.fecha < hoy };
      }))
    ],
    registradoPor
  };
  state.cobros.push(cobroVirtual);

  // Crear plan nuevo
  const planNuevo = {
    id: uid(),
    clienteId,
    cartera,
    capital: nuevoCapital,
    valorCuota: nuevaCuota,
    totalCuotas,
    cuotaActual: 1,
    fechaInicio: inicio,
    frecuencia,
    estado: 'activo',
    planRenovadoDesde: planIdARenovar,
    tasaAplicada: ((nuevaCuota * totalCuotas - nuevoCapital) / nuevoCapital * 100).toFixed(2)
  };
  state.planes.push(planNuevo);

  // Generar cuotas del plan nuevo
  const nuevasCuotas = generarCuotas(planNuevo);
  state.cuotas.push(...nuevasCuotas);

  // Registrar renovación con desglose completo
  const renovacion = {
    id: uid(),
    fecha: hoy,
    clienteId,
    cartera,
    planViejoId: planIdARenovar,
    planNuevoId: planNuevo.id,
    capital: nuevoCapital,
    cuotasRestantesDescontadas: calc.cuotasRestantes,
    descuentoPlanRenovar: calc.descuentoPlanRenovar,
    descuentosOtros: calc.otrosPlanes,
    totalDescuento: calc.totalDescuento,
    netoEntregado: calc.netoEntregar,
    efectivoEntregado: efectivoEntregado || 0,
    transferenciaEntregada: transferenciaEntregada || 0,
    capitalDescontado: calc.capitalDescontado,
    gananciaDescontada: calc.gananciaDescontada,
    cobroVirtualId: cobroVirtual.id,
    registradoPor
  };
  state.renovaciones.push(renovacion);
  save();
  return { planNuevo, renovacion, calc };
};

// --- CÁLCULOS PARA PANTALLAS ---
const getClienteResumen = (clienteId) => {
  const hoy = today();
  const planes = state.planes.filter(p => p.clienteId === clienteId && p.estado === 'activo');
  
  let totalHoy = 0;
  let deudaHoy = 0;
  const resumenPlanes = [];

  planes.forEach(plan => {
    const cuotasActivas = state.cuotas.filter(c => c.planId === plan.id && (c.estado === 'pendiente' || c.estado === 'parcial'));
    const cuotaHoy = cuotasActivas.find(c => c.fecha === hoy);
    const cuotasVencidas = cuotasActivas.filter(c => c.fecha < hoy);
    const cuotasPagadas = state.cuotas.filter(c => c.planId === plan.id && c.estado === 'pagada').length;

    if (cuotaHoy) totalHoy += cuotaHoy.saldoPendiente !== undefined ? cuotaHoy.saldoPendiente : cuotaHoy.monto;
    // Incluir cuotas parciales en la deuda
    const deudaPlan = cuotasVencidas.reduce((s, c) => s + (c.saldoPendiente !== undefined ? c.saldoPendiente : c.monto), 0);
    deudaHoy += deudaPlan;

    const cuotaActualNum = cuotasPagadas + 1;

    resumenPlanes.push({
      plan,
      cuotaActualNum,
      cuotaHoy,
      cuotasVencidas,
      deudaPlan,
      cuotasRestantesTotal: cuotasActivas.length,
      cuotasFuturas: cuotasActivas.filter(c => c.fecha > hoy)
    });
  });

  return { planes: resumenPlanes, totalHoy, deudaHoy };
};

// --- CRITERIO DE RENOVACIÓN (85%) ---
const puedeRenovar = (planId) => {
  const plan = state.planes.find(p => p.id === planId);
  if (!plan || plan.estado !== 'activo') return false;
  const hoy = today();
  const vencidas = state.cuotas.filter(c => c.planId === planId && (c.estado === 'pendiente' || c.estado === 'parcial') && c.fecha < hoy).length;
  if (vencidas > 0) return false;
  const pagadas = state.cuotas.filter(c => c.planId === planId && (c.estado === 'pagada' || c.estado === 'saldada_renovacion')).length;
  return pagadas >= Math.ceil(plan.totalCuotas * 0.85);
};

const estadoRenovacion = (planId) => {
  const plan = state.planes.find(p => p.id === planId);
  if (!plan || plan.estado !== 'activo') return null;
  const hoy = today();
  const totalCuotas = plan.totalCuotas;
  const pagadas = state.cuotas.filter(c => c.planId === planId && (c.estado === 'pagada' || c.estado === 'saldada_renovacion')).length;
  const vencidas = state.cuotas.filter(c => c.planId === planId && c.estado === 'pendiente' && c.fecha < hoy).length;
  const umbral85 = Math.ceil(totalCuotas * 0.85);
  const umbral100 = totalCuotas;
  const tieneAtraso = vencidas > 0;

  // Calcular fecha en que llegaría al 85% si pagara todo
  const cuotasPorPagar = state.cuotas.filter(c => c.planId === planId).sort((a, b) => a.numero - b.numero);
  const fechaUmbral85 = cuotasPorPagar.length >= umbral85 ? cuotasPorPagar[umbral85 - 1].fecha : null;
  const fechaUmbral100 = cuotasPorPagar.length >= umbral100 ? cuotasPorPagar[umbral100 - 1].fecha : null;

  if (pagadas >= umbral100) {
    // Puede renovar — completó el 100%
    return { estado: 'puede', nivel: 100, tieneAtraso, fechaUmbral85, fechaUmbral100 };
  } else if (pagadas >= umbral85) {
    // Se le puede ofrecer — llegó al 85%
    return { estado: 'ofrecer', nivel: 85, tieneAtraso, fechaUmbral85, fechaUmbral100 };
  } else {
    // Todavía no — mostrar cuándo llegaría
    return { estado: 'no', nivel: Math.round(pagadas / totalCuotas * 100), tieneAtraso, fechaUmbral85, fechaUmbral100 };
  }
};

const cuandoPuedeRenovar = (planId) => {
  const plan = state.planes.find(p => p.id === planId);
  if (!plan) return null;
  const umbral = Math.ceil(plan.totalCuotas * 0.85);
  const cuotas = state.cuotas.filter(c => c.planId === planId).sort((a, b) => a.numero - b.numero);
  if (cuotas.length < umbral) return null;
  return cuotas[umbral - 1].fecha;
};

// --- RESUMEN CIERRE DEL DÍA ---
const calcularSaldoTeoricoFecha = (cartera, fecha) => {
  // Buscar el cierre más reciente ANTERIOR o igual a la fecha
  const cierresAnteriores = state.cierres
    .filter(c => c.cartera === cartera && c.fecha <= fecha)
    .sort((a, b) => b.fecha.localeCompare(a.fecha));

  let saldoEfectivo = cierresAnteriores.length > 0 ? cierresAnteriores[0].saldoFinalEfectivo : 0;
  let saldoTransferencia = cierresAnteriores.length > 0 ? cierresAnteriores[0].saldoFinalTransferencia : 0;
  const fechaDesde = cierresAnteriores.length > 0 ? cierresAnteriores[0].fecha : '2000-01-01';

  // Sumar todos los movimientos DESDE el cierre hasta la fecha pedida (acumulado)
  const cobrosRango = state.cobros.filter(c => c.fecha > fechaDesde && c.fecha <= fecha && c.cartera === cartera && !c.esVirtual);
  cobrosRango.forEach(c => {
    saldoEfectivo += (c.montoEfectivo || 0) + (c.interesEfectivo || 0);
    saldoTransferencia += (c.montoTransferencia || 0) + (c.interesTransferencia || 0);
  });

  const gastosRango = state.gastos.filter(g => g.fecha > fechaDesde && g.fecha <= fecha && g.cartera === cartera);
  gastosRango.forEach(g => {
    saldoEfectivo -= g.montoEfectivo || 0;
    saldoTransferencia -= g.montoTransferencia || 0;
  });

  const renovacionesRango = state.renovaciones.filter(r => r.fecha > fechaDesde && r.fecha <= fecha && r.cartera === cartera);
  renovacionesRango.forEach(r => {
    saldoEfectivo -= r.efectivoEntregado || 0;
    saldoTransferencia -= r.transferenciaEntregada || 0;
  });

  const creditosNuevosRango = state.planes.filter(p => p.fechaInicio > fechaDesde && p.fechaInicio <= fecha && p.cartera === cartera && (p.efectivoEntregado > 0 || p.transferenciaEntregada > 0));
  creditosNuevosRango.forEach(p => {
    saldoEfectivo -= p.efectivoEntregado || 0;
    saldoTransferencia -= p.transferenciaEntregada || 0;
  });

  // Para el resumen del día específico (solo el día pedido)
  const cobrosHoy = cobrosRango.filter(c => c.fecha === fecha);
  const gastosHoy = gastosRango.filter(g => g.fecha === fecha);
  const renovacionesHoy = renovacionesRango.filter(r => r.fecha === fecha);

  const totalCobradoEfectivo = cobrosHoy.reduce((s, c) => s + (c.montoEfectivo || 0) + (c.interesEfectivo || 0), 0);
  const totalCobradoTransferencia = cobrosHoy.reduce((s, c) => s + (c.montoTransferencia || 0) + (c.interesTransferencia || 0), 0);
  const totalGastosEfectivo = gastosHoy.reduce((s, g) => s + (g.montoEfectivo || 0), 0);
  const totalGastosTransferencia = gastosHoy.reduce((s, g) => s + (g.montoTransferencia || 0), 0);
  const totalRenovacionesEfectivo = renovacionesHoy.reduce((s, r) => s + (r.efectivoEntregado || 0), 0);
  const totalRenovacionesTransferencia = renovacionesHoy.reduce((s, r) => s + (r.transferenciaEntregada || 0), 0);
  const totalCuotasVirtuales = renovacionesHoy.reduce((s, r) => s + (r.totalDescuento || 0), 0);

  return {
    saldoEfectivo, saldoTransferencia,
    totalCobradoEfectivo, totalCobradoTransferencia,
    totalGastosEfectivo, totalGastosTransferencia,
    totalRenovacionesEfectivo, totalRenovacionesTransferencia,
    totalCuotasVirtuales,
    renovacionesHoy: renovacionesHoy.length
  };
};

const calcularSaldoTeorico = (cartera) => calcularSaldoTeoricoFecha(cartera, today());

// --- DASHBOARD ADMIN ---
const getDashboardData = (cartera, periodo, fechaRef, desdeOverride, hastaOverride) => {
  const hoy = fechaRef || today();
  let desde, hasta;

  if (periodo === 'dia') { desde = hoy; hasta = hoy; }
  else if (periodo === 'semana') {
    const d = new Date(hoy + 'T12:00:00');
    d.setDate(d.getDate() - d.getDay() + 1);
    desde = d.toISOString().slice(0, 10);
    hasta = addDays(desde, 6);
  } else if (periodo === 'rango') {
    desde = desdeOverride || today();
    hasta = hastaOverride || today();
  } else {
    desde = hoy.slice(0, 7) + '-01';
    const d = new Date(hoy.slice(0, 7) + '-01T12:00:00');
    d.setMonth(d.getMonth() + 1);
    d.setDate(0);
    hasta = d.toISOString().slice(0, 10);
  }

  const cobros = state.cobros.filter(c => c.fecha >= desde && c.fecha <= hasta && !c.esVirtual && (!cartera || c.cartera === cartera));
  const cobrosVirtuales = state.cobros.filter(c => c.fecha >= desde && c.fecha <= hasta && c.esVirtual && (!cartera || c.cartera === cartera));
  const gastos = state.gastos.filter(g => g.fecha >= desde && g.fecha <= hasta && (!cartera || g.cartera === cartera));
  const renovaciones = state.renovaciones.filter(r => r.fecha >= desde && r.fecha <= hasta && (!cartera || r.cartera === cartera));

  // Cobros reales
  const totalCobradoEfectivo = cobros.reduce((s, c) => s + (c.montoEfectivo || 0) + (c.interesMora || 0), 0);
  const totalCobradoTransferencia = cobros.reduce((s, c) => s + (c.montoTransferencia || 0), 0);
  const totalIntereses = cobros.reduce((s, c) => s + (c.interesMora || 0), 0);
  const totalGastos = gastos.reduce((s, g) => s + (g.montoEfectivo || 0) + (g.montoTransferencia || 0), 0);

  // Créditos entregados en renovaciones
  const totalRenovacionesEntregado = renovaciones.reduce((s, r) => s + (r.capital || 0), 0);
  const totalRenovacionesNeto = renovaciones.reduce((s, r) => s + (r.netoEntregado || 0), 0);
  const totalCuotasVirtuales = renovaciones.reduce((s, r) => s + (r.totalDescuento || 0), 0);

  // Desglose capital vs ganancia (cobros reales + virtuales)
  let totalCapitalRecuperado = 0;
  let totalGanancia = 0;

  [...cobros, ...cobrosVirtuales].forEach(cobro => {
    (cobro.imputacion || []).forEach(imp => {
      const plan = state.planes.find(p => p.id === imp.planId);
      if (plan) {
        const capitalPorCuota = plan.capital / plan.totalCuotas;
        totalCapitalRecuperado += capitalPorCuota;
        totalGanancia += (imp.montoImputado || 0) - capitalPorCuota;
      }
    });
  });

  // Capital en calle
  const planesActivos = state.planes.filter(p => p.estado === 'activo' && (!cartera || p.cartera === cartera));
  const capitalEnCalle = planesActivos.reduce((s, p) => {
    const pendientes = state.cuotas.filter(c => c.planId === p.id && c.estado === 'pendiente').length;
    return s + (pendientes * p.valorCuota);
  }, 0);

  // Capital propio total invertido
  const capitalPropio = planesActivos.reduce((s, p) => s + p.capital, 0);

  // Ganancia reinvertida en el período
  const gananciaReinvertida = renovaciones.reduce((s, r) => s + (r.gananciaDescontada || 0), 0);
  const gananciaDisponible = totalGanancia + totalIntereses - totalGastos - gananciaReinvertida;

  // Gastos desglosados agrupados
  const gastosAgrupados = {};
  gastos.forEach(g => {
    const key = g.descripcion.toLowerCase().trim();
    if (!gastosAgrupados[key]) gastosAgrupados[key] = { descripcion: g.descripcion, total: 0, totalEfectivo: 0, totalTransferencia: 0, fechas: [] };
    gastosAgrupados[key].total += (g.montoEfectivo || 0) + (g.montoTransferencia || 0);
    gastosAgrupados[key].totalEfectivo += g.montoEfectivo || 0;
    gastosAgrupados[key].totalTransferencia += g.montoTransferencia || 0;
    gastosAgrupados[key].fechas.push(g.fecha);
  });

  // Proyección del mes (cuotas pendientes en el mes)
  const mesActual = hoy.slice(0, 7);
  const cuotasPendientesMes = state.cuotas.filter(c =>
    c.fecha?.startsWith(mesActual) && c.estado === 'pendiente' &&
    (!cartera || state.planes.find(p => p.id === c.planId)?.cartera === cartera)
  );
  const proyeccionMes = cuotasPendientesMes.reduce((s, c) => s + c.monto, 0);

  return {
    periodo, desde, hasta,
    totalCobradoEfectivo, totalCobradoTransferencia,
    totalCobrado: totalCobradoEfectivo + totalCobradoTransferencia,
    totalIntereses, totalGastos,
    totalCapitalRecuperado, totalGanancia,
    gananciaNeta: totalGanancia + totalIntereses - totalGastos,
    gananciaReinvertida, gananciaDisponible,
    capitalEnCalle, capitalPropio,
    totalRenovacionesEntregado, totalRenovacionesNeto, totalCuotasVirtuales,
    gastosAgrupados: Object.values(gastosAgrupados),
    cantidadRenovaciones: renovaciones.length,
    cobros: cobros.length,
    proyeccionMes
  };
};

// Exportar para uso global
window.APP = {
  state, save, load, uid, today, formatDate, formatMoney,
  isHabil, nextHabil, addDays, diffDays,
  generarCuotas, imputarPago, aplicarImputacion,
  calcularRenovacion, confirmarRenovacion,
  getClienteResumen, puedeRenovar, estadoRenovacion, cuandoPuedeRenovar,
  calcularSaldoTeorico, calcularSaldoTeoricoFecha, getDashboardData,
  USERS
};
</script>
<script>const DB_DOC = 'pec_cobros/data';

let db = null;
let unsubscribe = null;
let syncEnabled = false;
let lastSyncTime = parseInt(localStorage.getItem('_lastSyncTime') || '0');

const loadScript = (src) => new Promise((resolve, reject) => {
  const s = document.createElement('script');
  s.src = src;
  s.onload = resolve;
  s.onerror = reject;
  document.head.appendChild(s);
});

const initFirebase = async () => {
  try {
    if (typeof firebase === 'undefined') {
      await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js');
    }

    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    syncEnabled = true;
    console.log('Firebase conectado ✓');

    const docRef = db.collection('pec_cobros').doc('data');
    const snap = await docRef.get();
    const remoteData = snap.exists ? snap.data() : null;
    const tieneClientes = remoteData && remoteData.clientes && remoteData.clientes.length > 0;
    const versionOk = remoteData && (remoteData._seedVersion || 0) >= 7;

    if (tieneClientes && versionOk) {
      const localData = JSON.parse(localStorage.getItem('prestamos_data') || '{}');
      const cierresIniciales = (localData.cierres || []).filter(c => c.esSaldoInicial || (c.id && c.id.includes('inicial')));
      Object.assign(window.APP.state, remoteData);
      cierresIniciales.forEach(ci => {
        const exists = window.APP.state.cierres.some(c => c.id === ci.id);
        if (!exists) window.APP.state.cierres.push(ci);
      });
      localStorage.setItem('prestamos_data', JSON.stringify(window.APP.state));
      lastSyncTime = remoteData.lastUpdate || 0;
      localStorage.setItem('_lastSyncTime', String(lastSyncTime));
      console.log('Firebase: datos cargados', remoteData.clientes.length, 'clientes');
      setTimeout(() => { if (window.showHome) window.showHome(); }, 100);
    } else {
      console.log('Firebase sin datos — subiendo seed...');
      if (typeof SEED_DATA !== 'undefined' && SEED_DATA.clientes && SEED_DATA.clientes.length > 0) {
        Object.assign(window.APP.state, SEED_DATA);
        localStorage.setItem('prestamos_data', JSON.stringify(SEED_DATA));
        lastSyncTime = Date.now();
        localStorage.setItem('_lastSyncTime', String(lastSyncTime));
        const dataToSync = Object.assign({}, window.APP.state, { lastUpdate: lastSyncTime });
        delete dataToSync.user;
        await docRef.set(dataToSync);
        console.log('Seed subido a Firebase ✓');
      }
    }

    // Listener tiempo real
    unsubscribe = docRef.onSnapshot((snapshot) => {
      if (!snapshot.exists) return;
      const data = snapshot.data();
      if (!data) return;
      const remoteTime = data.lastUpdate || 0;
      // Ignorar solo si es exactamente mi propio update
      if (remoteTime === lastSyncTime) return;
      const cierresIniciales = (window.APP.state.cierres || []).filter(c => c.esSaldoInicial || (c.id && c.id.includes('inicial')));
      Object.assign(window.APP.state, data);
      cierresIniciales.forEach(ci => {
        const exists = window.APP.state.cierres.some(c => c.id === ci.id);
        if (!exists) window.APP.state.cierres.push(ci);
      });
      localStorage.setItem('prestamos_data', JSON.stringify(window.APP.state));
      lastSyncTime = remoteTime;
      localStorage.setItem('_lastSyncTime', String(lastSyncTime));
      setTimeout(() => { if (window.showHome) window.showHome(); }, 100);
      console.log('Firebase: actualización recibida', new Date().toLocaleTimeString());
    });

    return true;
  } catch (err) {
    console.error('Error Firebase:', err);
    syncEnabled = false;
    return false;
  }
};

let syncTimeout = null;
const syncToFirebase = () => {
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(async () => {
    try {
      const firedb = db ? db : firebase.firestore();
      lastSyncTime = Date.now();
      localStorage.setItem('_lastSyncTime', String(lastSyncTime));
      const dataToSync = Object.assign({}, window.APP.state, { lastUpdate: lastSyncTime });
      delete dataToSync.user;
      // Eliminar campos undefined que Firebase rechaza
      const cleanData = JSON.parse(JSON.stringify(dataToSync));
      await firedb.collection('pec_cobros').doc('data').set(cleanData);
      console.log('Firebase: sync OK', new Date().toLocaleTimeString());
    } catch (err) {
      console.error('Error sincronizando:', err);
    }
  }, 1500);
};

const showSyncStatus = (connected) => {
  let indicator = document.getElementById('sync-indicator');
  if (!indicator) {
    indicator = document.createElement('div');
    indicator.id = 'sync-indicator';
    indicator.style.cssText = 'position:fixed;top:8px;right:60px;z-index:9999;font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;font-family:var(--font)';
    document.body.appendChild(indicator);
  }
  if (connected) {
    indicator.style.background = 'rgba(0,212,170,0.2)';
    indicator.style.color = 'var(--accent)';
    indicator.textContent = '● sync';
  } else {
    indicator.style.background = 'rgba(255,170,0,0.2)';
    indicator.style.color = 'var(--warn)';
    indicator.textContent = '● offline';
  }
};

window.initFirebaseSync = async () => {
  showSyncStatus(false);
  const ok = await initFirebase();
  // Interceptar save para sincronizar
  const originalSave = window.APP.save;
  window.APP.save = () => {
    originalSave();
    syncToFirebase();
  };
  console.log('Firebase sync instalado ✓');
  showSyncStatus(ok);
  window._syncReady = ok;
  window._syncToFirebase = syncToFirebase;
  return ok;
};
</script>
<script>(function() {
var APP = window.APP;
var state = APP.state; var save = APP.save; var load = APP.load; var uid = APP.uid;
var today = APP.today; var formatDate = APP.formatDate; var formatMoney = APP.formatMoney;
var nextHabil = APP.nextHabil; var addDays = APP.addDays; var generarCuotas = APP.generarCuotas;
var imputarPago = APP.imputarPago; var aplicarImputacion = APP.aplicarImputacion;
var calcularRenovacion = APP.calcularRenovacion; var confirmarRenovacion = APP.confirmarRenovacion;
var getClienteResumen = APP.getClienteResumen; var puedeRenovar = APP.puedeRenovar;
var estadoRenovacion = APP.estadoRenovacion;
var cuandoPuedeRenovar = APP.cuandoPuedeRenovar; var calcularSaldoTeorico = APP.calcularSaldoTeorico;
var calcularSaldoTeoricoFecha = APP.calcularSaldoTeoricoFecha;
var getDashboardData = APP.getDashboardData; var USERS = APP.USERS;
// ============================================================
// UI CONTROLLER — TODAS LAS PANTALLAS
// ============================================================


// ===== NAVIGATION STACK =====
let navStack = [];
let currentUser = null;

const toast = (msg, type = 'success') => {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3200);
};

const setHeader = (title, sub = '', showBack = false) => {
  document.getElementById('header-title').textContent = title;
  document.getElementById('header-sub').textContent = sub;
  document.getElementById('back-btn').style.display = showBack ? 'flex' : 'none';
};

const render = (html, title, sub = '', showBack = false) => {
  document.getElementById('main-content').innerHTML = html;
  setHeader(title, sub, showBack);
};

const goBack = () => {
  if (navStack.length > 1) {
    navStack.pop();
    const prev = navStack[navStack.length - 1];
    prev();
  } else {
    showHome();
  }
};

const navigate = (fn) => {
  navStack.push(fn);
  fn();
};

// ===== LOGIN =====
const doLogin = () => {
  const user = document.getElementById('login-user').value.trim().toLowerCase();
  const pass = document.getElementById('login-pass').value;

  load();
  if (state.usuarios && state.usuarios.length > 0) {
    state.usuarios.forEach(u => {
      APP.USERS[u.key] = { password: u.password, role: u.role, name: u.nombre, cartera: u.cartera };
    });
  }

  const found = APP.USERS[user];
  if (found && found.password === pass) {
    currentUser = { ...found, key: user };
    // Guardar sesión
    localStorage.setItem('prestamos_session', JSON.stringify({ key: user, ...found }));
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    if (state.clientes.length === 0) seedDemoData();
    initNav();
    showHome();
    // Iniciar sync Firebase después de renderizar
    setTimeout(() => {
      if (window.initFirebaseSync) {
        window.initFirebaseSync().then(() => {
          if (window.APP.state.clientes.length > 0) showHome();
        });
      }
    }, 300);
  } else {
    document.getElementById('login-error').style.display = 'block';
  }
};

const doLogout = () => {
  currentUser = null;
  navStack = [];
  localStorage.removeItem('prestamos_session');
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pass').value = '';
};

// ===== BOTTOM NAV =====
const initNav = () => {
  const nav = document.getElementById('bottom-nav');
  const isAdmin = currentUser.role === 'admin';
  const items = isAdmin
    ? [
        { icon: '🏠', label: 'Inicio', fn: showHome },
        { icon: '👥', label: 'Clientes', fn: showClientes },
        { icon: '📊', label: 'Dashboard', fn: showDashboard },
        { icon: '📅', label: 'Renovar', fn: () => showCalendarioRenovaciones(currentUser.cartera) },
        { icon: '⚙️', label: 'Usuarios', fn: showUsuarios }
      ]
    : [
        { icon: '🏠', label: 'Inicio', fn: showHome },
        { icon: '👥', label: 'Clientes', fn: showClientes },
        { icon: '💸', label: 'Gastos', fn: showGastos },
        { icon: '📅', label: 'Renovar', fn: () => showCalendarioRenovaciones(currentUser.cartera) }
      ];

  nav.innerHTML = items.map((item, i) => `
    <button class="nav-item" id="nav-${i}" onclick="navClick(${i})">
      <span class="nav-icon">${item.icon}</span>
      ${item.label}
    </button>
  `).join('');

  window._navItems = items;
};

let activeNav = 0;
const navClick = (i) => {
  document.querySelectorAll('.nav-item').forEach((el, j) => el.classList.toggle('active', j === i));
  activeNav = i;
  navStack = [];
  window._navItems[i].fn();
};

// ===== HOME — COBRADOR =====
const showHome = () => {
  const cartera = currentUser.cartera;
  const hoy = today();
  const isAdmin = currentUser.role === 'admin';

  const clientesCartera = state.clientes.filter(c => c.cartera === cartera && c.activo !== false);

  // Calcular estado de cada cliente
  const clientesConInfo = clientesCartera.map(cl => {
    const planesActivos = state.planes.filter(p => p.clienteId === cl.id && p.estado === 'activo');
    const r = getClienteResumen(cl.id);

    const cobroHoy = state.cobros.filter(c => c.clienteId === cl.id && c.fecha === hoy);
    const yaCobroHoy = cobroHoy.length > 0;
    const totalCobradoHoy = cobroHoy.filter(c => !c.esVirtual).reduce((s, c) => s + c.montoPagado + (c.interesMora||0), 0) +
      cobroHoy.filter(c => c.esVirtual).reduce((s, c) => s + (c.montoPagado || 0), 0);

    // Calcular estado real de cuotas
    const cuotasVencidas = state.cuotas.filter(c =>
      c.clienteId === cl.id && (c.estado === 'pendiente' || c.estado === 'parcial') && c.fecha < hoy
    );
    const cuotasHoy = state.cuotas.filter(c =>
      c.clienteId === cl.id && (c.estado === 'pendiente' || c.estado === 'parcial') && c.fecha === hoy
    );
    const cuotasFuturas = state.cuotas.filter(c =>
      c.clienteId === cl.id && (c.estado === 'pendiente' || c.estado === 'parcial') && c.fecha > hoy
    );
    const tieneVencidas = cuotasVencidas.length > 0;
    const tieneHoy = cuotasHoy.length > 0;
    const tieneFuturas = cuotasFuturas.length > 0;
    const tieneCuotaHoy = tieneHoy;
    const tieneDeuda = tieneVencidas;

    // Color según estado
    let color, borderColor, badge;
    if (tieneVencidas) {
      color = 'var(--danger)'; borderColor = 'rgba(255,77,109,0.4)'; badge = '🔴 Vencida';
    } else if (tieneHoy) {
      color = 'var(--warn)'; borderColor = 'rgba(255,170,0,0.4)'; badge = '🟠 Hoy';
    } else if (!yaCobroHoy && tieneFuturas) {
      color = 'var(--text2)'; borderColor = 'var(--border)'; badge = '';
    } else if (yaCobroHoy && !tieneVencidas && !tieneHoy && tieneFuturas) {
      color = '#4fc3f7'; borderColor = 'rgba(79,195,247,0.4)'; badge = '🔵 Adelantado';
    } else {
      color = 'var(--accent)'; borderColor = 'rgba(0,212,170,0.3)'; badge = '🟢 Al día';
    }

    return { cl, r, planesActivos, tieneCuotaHoy, yaCobroHoy, totalCobradoHoy, tieneDeuda, tieneVencidas, tieneHoy, tieneFuturas, color, borderColor, badge };
  });

  // Separar grupos — cobrado siempre va abajo aunque tenga deuda restante
  const pendientesHoy = clientesConInfo.filter(x => (x.tieneCuotaHoy || x.tieneDeuda) && !x.yaCobroHoy);
  const cobradosHoy = clientesConInfo.filter(x => x.yaCobroHoy);
  // Si un cliente cobró parcial y aún debe, aparece en cobrados (abajo, en verde) no en pendientes

  // Cancelaron HOY
  const cancelaronHoy = clientesCartera.filter(cl => {
    return state.planes.some(p => p.clienteId === cl.id && p.estado === 'cancelado' && p.fechaCancelacion === hoy);
  });

  // Cancelados pendientes (cancelaron antes de hoy, no renovaron, no archivados)
  const canceladosPendientes = clientesCartera.filter(cl => {
    const tienePlanesActivos = state.planes.some(p => p.clienteId === cl.id && p.estado === 'activo');
    const tienePlanCancelado = state.planes.some(p => p.clienteId === cl.id && p.estado === 'cancelado' && p.fechaCancelacion < hoy);
    const archivado = cl.archivado === true;
    return !tienePlanesActivos && tienePlanCancelado && !archivado;
  });

  // Totales solo de pendientes
  let totalHoy = 0, totalDeuda = 0;
  pendientesHoy.forEach(x => { totalHoy += x.r.totalHoy; totalDeuda += x.r.deudaHoy; });

  let html = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div>
        <div style="font-size:22px;font-weight:700">Hola, ${currentUser.name} 👋</div>
        <div style="font-size:13px;color:var(--text2);margin-top:2px">${formatDate(hoy)}</div>
      </div>
      ${isAdmin ? `<button class="btn btn-secondary btn-sm" style="width:auto;padding:8px 14px;font-size:13px" onclick="recargarDatos()">🔄 Actualizar</button>` : ''}
    </div>
    <div class="divider"></div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Por cobrar hoy</div>
        <div class="stat-value accent">${formatMoney(totalHoy)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Deuda acumulada</div>
        <div class="stat-value ${totalDeuda > 0 ? 'danger' : ''}">${totalDeuda > 0 ? formatMoney(totalDeuda) : '—'}</div>
      </div>
    </div>
  `;

  // Renovaciones del día (solo admin)
  if (isAdmin) {
    const renovacionesHoy = state.renovaciones.filter(r => r.fecha === hoy);
    if (renovacionesHoy.length > 0) {
      html += `<div class="section-title">🔄 Renovaciones de hoy</div>`;
      renovacionesHoy.forEach(r => {
        const cl = state.clientes.find(c => c.id === r.clienteId);
        const planNuevo = state.planes.find(p => p.id === r.planNuevoId);
        html += `
          <div class="card" style="border-color:rgba(124,106,247,0.3)">
            <div style="font-size:14px;font-weight:600">${cl ? cl.nombre : 'Cliente'}</div>
            <div style="font-size:12px;color:var(--text2);margin-top:4px">
              Plan anterior cancelado → Nuevo: ${formatMoney(planNuevo?.capital)} / ${planNuevo?.totalCuotas} cuotas
            </div>
            <div style="font-size:12px;color:var(--text2)">Inicia: ${formatDate(planNuevo?.fechaInicio)}</div>
          </div>
        `;
      });
    }
  }

  // PENDIENTES DE COBRO
  html += `<div class="section-title">Por cobrar (${pendientesHoy.length})</div>`;
  if (pendientesHoy.length === 0) {
    html += `<div class="empty-state" style="padding:24px"><div class="empty-icon">✅</div><div class="empty-text">Todos cobrados</div></div>`;
  } else {
    pendientesHoy.forEach(({ cl, r, color, borderColor, tieneVencidas, tieneHoy }) => {
      const iniciales = cl.nombre.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      html += `
        <div class="cliente-item" style="border-color:${borderColor}" onclick="navigate(() => showCliente('${cl.id}'))">
          <div class="cliente-avatar" style="background:linear-gradient(135deg,${color},${color}99)">${iniciales}</div>
          <div class="cliente-info">
            <div class="cliente-nombre">${cl.nombre}</div>
            <div class="cliente-sub" style="color:${color}">${tieneVencidas ? '🔴 Cuota vencida' : tieneHoy ? '🟠 Cuota hoy' : 'Sin cuota hoy'}</div>
          </div>
          <div class="cliente-monto">
            ${r.totalHoy > 0 ? `<div class="cliente-monto-hoy">${formatMoney(r.totalHoy)}</div>` : ''}
            ${r.deudaHoy > 0 ? `<div class="cliente-deuda" style="color:var(--danger)">Debe ${formatMoney(r.deudaHoy)}</div>` : ''}
          </div>
        </div>
      `;
    });
  }

  // YA COBRADOS HOY
  if (cobradosHoy.length > 0) {
    html += `<div class="section-title" style="color:var(--accent)">✅ Cobrados hoy (${cobradosHoy.length})</div>`;
    cobradosHoy.forEach(({ cl, totalCobradoHoy, r, color, borderColor, badge, tieneVencidas, tieneHoy, tieneFuturas }) => {
      const iniciales = cl.nombre.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      html += `
        <div class="cliente-item" style="opacity:0.85;border-color:${borderColor}" onclick="navigate(() => showCliente('${cl.id}'))">
          <div class="cliente-avatar" style="background:linear-gradient(135deg,${color},${color}99)">✓</div>
          <div class="cliente-info">
            <div class="cliente-nombre">${cl.nombre}</div>
            <div class="cliente-sub" style="color:${color}">${badge}</div>
          </div>
          <div class="cliente-monto">
            <div class="cliente-monto-hoy">${formatMoney(totalCobradoHoy)}</div>
            ${r.deudaHoy > 0 ? `<div class="cliente-deuda" style="color:var(--danger)">Debe ${formatMoney(r.deudaHoy)}</div>` : ''}
          </div>
        </div>
      `;
    });
  }

  // CANCELARON HOY
  if (cancelaronHoy.length > 0) {
    html += `<div class="section-title" style="color:var(--accent)">🏁 Cancelaron hoy (${cancelaronHoy.length})</div>`;
    cancelaronHoy.forEach(cl => {
      const iniciales = cl.nombre.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      const planCancelado = state.planes.find(p => p.clienteId === cl.id && p.estado === 'cancelado' && p.fechaCancelacion === hoy);
      html += `
        <div class="cliente-item" style="border-color:rgba(0,212,170,0.4);background:rgba(0,212,170,0.05)" onclick="navigate(() => showCliente('${cl.id}'))">
          <div class="cliente-avatar" style="background:linear-gradient(135deg,#00d4aa,#00b894)">🏁</div>
          <div class="cliente-info">
            <div class="cliente-nombre">${cl.nombre}</div>
            <div class="cliente-sub" style="color:var(--accent)">Canceló hoy · ${formatMoney(planCancelado?.capital)}</div>
          </div>
          <span class="badge badge-green">Cancelado</span>
        </div>
      `;
    });
  }

  // ALERTAS DE INACTIVIDAD — solo admin
  if (isAdmin) {
    const sinActividad = getClientesSinActividad(currentUser.cartera, 3);
    if (sinActividad.length > 0) {
      html += `<div class="section-title" style="color:var(--danger)">🚨 Sin pagar hace +3 días (${sinActividad.length})</div>`;
      sinActividad.forEach(({ cl, dias, cuotasVencidas, deudaTotal }) => {
        const iniciales = cl.nombre.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
        html += `
          <div class="cliente-item" style="border-color:rgba(255,77,109,0.4)" onclick="navigate(() => showCliente('${cl.id}'))">
            <div class="cliente-avatar" style="background:linear-gradient(135deg,var(--danger),#c0392b)">${iniciales}</div>
            <div class="cliente-info">
              <div class="cliente-nombre">${cl.nombre}</div>
              <div class="cliente-sub" style="color:var(--danger)">${cuotasVencidas} cuota${cuotasVencidas > 1 ? 's' : ''} vencida${cuotasVencidas > 1 ? 's' : ''} · ${dias === 999 ? 'Nunca pagó' : `${dias} días sin pagar`}</div>
              <div class="cliente-sub">${formatMoney(deudaTotal)}</div>
            </div>
            <span class="badge badge-red">Inactivo</span>
          </div>
        `;
      });
    }
  }

  // CANCELADOS PENDIENTES (no renovaron)
  if (canceladosPendientes.length > 0) {
    html += `<div class="section-title" style="color:var(--warn)">⏳ Cancelados sin renovar (${canceladosPendientes.length})</div>`;
    canceladosPendientes.forEach(cl => {
      const iniciales = cl.nombre.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      const ultimoPlan = state.planes.filter(p => p.clienteId === cl.id && p.estado === 'cancelado').sort((a, b) => b.fechaCancelacion?.localeCompare(a.fechaCancelacion))[0];
      html += `
        <div class="cliente-item" style="border-color:rgba(255,170,0,0.3)" onclick="navigate(() => showCliente('${cl.id}'))">
          <div class="cliente-avatar" style="background:linear-gradient(135deg,var(--warn),#e69500)">${iniciales}</div>
          <div class="cliente-info">
            <div class="cliente-nombre">${cl.nombre}</div>
            <div class="cliente-sub" style="color:var(--warn)">Canceló el ${formatDate(ultimoPlan?.fechaCancelacion)}</div>
          </div>
          ${isAdmin ? `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();archivarCliente('${cl.id}')">Archivar</button>` : '<span class="badge badge-warn">Sin renovar</span>'}
        </div>
      `;
    });
  }

  render(html, 'Inicio', formatDate(hoy));
  document.getElementById('nav-0')?.classList.add('active');
};

// ===== CLIENTES =====
const showClientes = () => {
  const cartera = currentUser.role === 'admin' ? null : currentUser.cartera;
  const clientes = state.clientes.filter(c => c.activo !== false && (!cartera || c.cartera === cartera));
  const isAdmin = currentUser.role === 'admin';

  let html = `
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Buscar cliente..." id="search-input" oninput="filterClientes()" />
    </div>
  `;

  if (isAdmin) {
    html += `<button class="btn btn-primary" style="margin-bottom:16px" onclick="showNuevoCliente()">+ Nuevo cliente</button>`;
  }

  if (clientes.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">Sin clientes aún</div></div>`;
  } else {
    html += `<div id="clientes-list">`;
    clientes.forEach(cl => {
      const planes = state.planes.filter(p => p.clienteId === cl.id && p.estado === 'activo');
      const iniciales = cl.nombre.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      const r = getClienteResumen(cl.id);
      html += `
        <div class="cliente-item" data-nombre="${cl.nombre.toLowerCase()}" onclick="navigate(() => showCliente('${cl.id}'))">
          <div class="cliente-avatar">${iniciales}</div>
          <div class="cliente-info">
            <div class="cliente-nombre">${cl.nombre}</div>
            <div class="cliente-sub">${planes.length} plan${planes.length !== 1 ? 'es' : ''} activos · ${cl.cartera === 'julieta' ? 'Cartera Julieta' : 'Cartera Jorge'}</div>
          </div>
          <div class="cliente-monto">
            ${r.deudaHoy > 0 ? `<span class="badge badge-red">Debe ${formatMoney(r.deudaHoy)}</span>` : `<span class="badge badge-green">Al día</span>`}
          </div>
        </div>
      `;
    });
    html += `</div>`;
  }

  render(html, 'Clientes');
};

const filterClientes = () => {
  const q = document.getElementById('search-input').value.toLowerCase();
  document.querySelectorAll('#clientes-list .cliente-item').forEach(el => {
    el.style.display = el.dataset.nombre.includes(q) ? '' : 'none';
  });
};

// ===== DETALLE CLIENTE =====
const showCliente = (clienteId) => {
  const cl = state.clientes.find(c => c.id === clienteId);
  if (!cl) return;
  const isAdmin = currentUser.role === 'admin';
  const hoy = today();
  const r = getClienteResumen(clienteId);

  let html = `
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;gap:14px;align-items:flex-start">
        <div class="cliente-avatar" style="width:56px;height:56px;font-size:22px;border-radius:16px">
          ${cl.nombre.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase()}
        </div>
        <div style="flex:1">
          <div style="font-size:18px;font-weight:700">${cl.nombre}</div>
          <div style="font-size:13px;color:var(--text2);margin-top:3px">📱 ${cl.telefono || 'Sin teléfono'}</div>
          <div style="font-size:13px;color:var(--text2)">📍 ${cl.direccion || 'Sin dirección'}</div>
          ${cl.referencia ? `<div style="font-size:13px;color:var(--text2)">👤 Ref: ${cl.referencia}</div>` : ''}
          ${cl.dni ? `<div style="font-size:13px;color:var(--text2)">🪪 DNI: ${cl.dni}</div>` : ''}
        </div>
      </div>
      ${isAdmin ? `
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="btn btn-secondary btn-sm" onclick="showEditCliente('${clienteId}')">✏️ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="eliminarCliente('${clienteId}')">🗑️ Eliminar</button>
        </div>
      ` : ''}
    </div>
  `;

  // Resumen de hoy
  html += `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Cuota hoy</div>
        <div class="stat-value accent">${formatMoney(r.totalHoy)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Deuda al día de hoy</div>
        <div class="stat-value ${r.deudaHoy > 0 ? 'danger' : ''}">${r.deudaHoy > 0 ? formatMoney(r.deudaHoy) : '—'}</div>
      </div>
    </div>
  `;

  // Aviso tasa más alta para cobrador
  if (currentUser.role !== 'admin' && r.planes.length > 1) {
    const tasas = r.planes.map(p => parseFloat(p.plan.tasaAplicada) || 0);
    const maxTasa = Math.max(...tasas);
    const minTasa = Math.min(...tasas);
    if (maxTasa > minTasa) {
      html += `<div class="card" style="border-color:var(--warn);margin-bottom:12px"><div style="color:var(--warn);font-size:13px;font-weight:500">⚠️ Este cliente tiene un plan con una tasa más alta</div></div>`;
    }
  }

  // Planes activos
  html += `<div class="section-title">Planes activos</div>`;

  if (r.planes.length === 0) {
    html += `<div style="color:var(--text3);font-size:14px;padding:16px 0">Sin planes activos</div>`;
  } else {
    r.planes.forEach(({ plan, cuotaActualNum, cuotaHoy, cuotasVencidas, cuotasRestantesTotal, cuotasFuturas }) => {
      const pagadas = state.cuotas.filter(c => c.planId === plan.id && c.estado === 'pagada').length;
      const pct = Math.round((pagadas / plan.totalCuotas) * 100);
      const puedeRen = puedeRenovar(plan.id);

      html += `
        <div class="plan-card">

const showRegistrarCobro = (clienteId) => {
  const cl = state.clientes.find(c => c.id === clienteId);

    ? Math.round(cuotasPendientes.filter(c => c.fecha < hoy).reduce((s, c) => s + Math.max(1, Math.round((new Date(hoy+'T12:00:00') - new Date(c.fecha+'T12:00:00')) / 86400000)), 0) / cuotasPendientes.filter(c => c.fecha < hoy).length)

      </div>
      <div class="tabs" style="margin-bottom:12px">
        <button class="tab active" id="mora-tab-pct" onclick="switchMoraTab('pct')">% del total</button>
        <button class="tab" id="mora-tab-dia" onclick="switchMoraTab('dia')">% por día</button>
      </div>
      <div id="mora-panel-pct">

          <input type="number" id="mora-pct-valor" placeholder="10" style="width:90px;padding:10px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:15px" oninput="calcularMora()">
          <span style="color:var(--text2);font-size:14px">% sobre ${formatMoney(totalDeuda)}</span>

      </div>
      <div id="mora-panel-dia" style="display:none">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <input type="number" id="mora-dia-valor" placeholder="1" style="width:90px;padding:10px;background:var(--bg3);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:15px" oninput="calcularMora()">
