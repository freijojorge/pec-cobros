const previewImputacion = (clienteId) => {
  const ef = Number(document.getElementById('cobro-efectivo')?.value || 0);
  const tr = Number(document.getElementById('cobro-transferencia')?.value || 0);
  const total = ef + tr;
  const preview = document.getElementById('cobro-preview');
  if (!preview || total <= 0) { if (preview) preview.innerHTML = ''; return; }

  const { imputacion, sobrante } = APP.imputarPago(clienteId, total);
  const hoy = today();

  // Agrupar imputación por plan
  const porPlan = {};
  imputacion.forEach(imp => {
    if (!porPlan[imp.planId]) {
      const plan = state.planes.find(p => p.id === imp.planId);
      porPlan[imp.planId] = { plan, items: [], total: 0 };
    }
    porPlan[imp.planId].items.push(imp);
    porPlan[imp.planId].total += imp.montoImputado;
  });

  let html = `<div class="resumen-box" style="margin-top:12px">
    <div style="font-size:12px;color:var(--text2);margin-bottom:10px;font-weight:600">IMPUTACIÓN AUTOMÁTICA</div>`;

  Object.values(porPlan).forEach(({ plan, items, total: totalPlan }) => {
    html += `
      <div style="margin-bottom:10px">
        <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">
          📋 Capital ${formatMoney(plan?.capital)}
          <span style="float:right;font-family:var(--mono);color:var(--accent)">${formatMoney(totalPlan)}</span>
        </div>
    `;
    items.forEach(imp => {
      html += `
        <div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 8px;background:var(--bg3);border-radius:4px;margin-bottom:3px">
          <span style="color:${imp.vencida ? 'var(--danger)' : 'var(--text2)'}">
            ${imp.parcial ? '⚡' : imp.vencida ? '⚠️' : '✓'} Cuota ${imp.numeroCuota}
            ${imp.parcial ? `<span style="color:var(--warn)"> · resta ${formatMoney(imp.saldoRestante)}</span>` : ''}
          </span>
          <span style="font-family:var(--mono)">${formatMoney(imp.montoImputado)}</span>
        </div>
      `;
    });
    html += `</div>`;
  });

  html += `
    <div class="resumen-row total" style="margin-top:4px">
      <span>Total imputado</span>
      <span class="resumen-value accent">${formatMoney(total)}</span>
    </div>
    ${sobrante > 0 ? `<div style="font-size:12px;color:var(--warn);margin-top:6px">⚠️ Sobran ${formatMoney(sobrante)} — todas las cuotas cubiertas</div>` : ''}
  </div>`;

  preview.innerHTML = html;
};

const switchMoraTab = (tab) => {
  window._moraTab = tab;
  document.getElementById('mora-tab-pct')?.classList.toggle('active', tab === 'pct');
  document.getElementById('mora-tab-dia')?.classList.toggle('active', tab === 'dia');
  document.getElementById('mora-panel-pct').style.display = tab === 'pct' ? '' : 'none';
  document.getElementById('mora-panel-dia').style.display = tab === 'dia' ? '' : 'none';
  calcularMora();
};

const calcularMora = () => {
  const deuda = window._moraDeuda || 0;
  const dias = window._moraDias || 1;
  const tab = window._moraTab || 'pct';

  if (tab === 'pct') {
    const pct = Number(document.getElementById('mora-pct-valor')?.value || 0);
    const resultado = Math.round(deuda * pct / 100);
    const el = document.getElementById('mora-pct-resultado');
    if (el) el.textContent = pct > 0 ? `→ Interés: ${formatMoney(resultado)}` : '';
  } else {
    const pct = Number(document.getElementById('mora-dia-valor')?.value || 0);
    const resultado = Math.round(deuda * pct / 100 * dias);
    const el = document.getElementById('mora-dia-resultado');
    if (el) el.textContent = pct > 0 ? `→ ${pct}% × ${dias} días = ${formatMoney(resultado)}` : '';
  }
};

const aplicarMoraCalculada = () => {
  const deuda = window._moraDeuda || 0;
  const dias = window._moraDias || 1;
  const tab = window._moraTab || 'pct';
  let resultado = 0;

  if (tab === 'pct') {
    const pct = Number(document.getElementById('mora-pct-valor')?.value || 0);
    resultado = Math.round(deuda * pct / 100);
  } else {
    const pct = Number(document.getElementById('mora-dia-valor')?.value || 0);
    resultado = Math.round(deuda * pct / 100 * dias);
  }

  if (resultado > 0) {
    document.getElementById('cobro-mora').value = resultado;
    recalcularCobro();
    toast(`Interés aplicado: ${formatMoney(resultado)}`);
  } else {
    toast('Ingresá un porcentaje primero', 'error');
  }
};

const toggleCuota = (i) => {
  const item = document.getElementById(`cuota-item-${i}`);
  const cb = document.getElementById(`cuota-cb-${i}`);
  const checked = item.classList.contains('checked');
  if (checked) {
    item.classList.remove('checked');
    cb.textContent = '';
  } else {
    item.classList.add('checked');
    cb.textContent = '✓';
  }
  recalcularCobro();
};

const recalcularCobro = () => {
  let total = 0;
  document.querySelectorAll('#cuotas-cobro .cuota-check-item.checked').forEach(el => {
    total += Number(el.dataset.monto || 0);
  });
  const mora = Number(document.getElementById('cobro-mora')?.value || 0);
  const totalFinal = total + mora;

  document.getElementById('r-cuotas').textContent = formatMoney(total);
  document.getElementById('r-mora').textContent = formatMoney(mora);
  document.getElementById('r-total').textContent = formatMoney(totalFinal);
};

const confirmarCobro = (clienteId) => {
  const mora = Number(document.getElementById('cobro-mora')?.value || 0);
  let efectivo = Number(document.getElementById('cobro-efectivo')?.value || 0);
  let transferencia = Number(document.getElementById('cobro-transferencia')?.value || 0);
  const interesEfectivo = Number(document.getElementById('cobro-interes-efectivo')?.value || 0);
  const interesTransferencia = Number(document.getElementById('cobro-interes-transferencia')?.value || 0);
  const interesTotal = interesEfectivo + interesTransferencia;

  // El monto total es lo que ingresó el usuario en efectivo + transferencia
  let montoPagado = efectivo + transferencia;

  // Si no ingresó método de pago, usar el total de cuotas chequeadas
  // Pero solo si tampoco ingresó interés
  if (montoPagado === 0 && interesTotal === 0) {
    const checkedIds = [];
    document.querySelectorAll('#cuotas-cobro .cuota-check-item.checked').forEach(el => checkedIds.push(el.dataset.id));
    montoPagado = checkedIds.reduce((s, id) => {
      const c = state.cuotas.find(q => q.id === id);
      return s + (c ? (c.saldoPendiente !== undefined ? c.saldoPendiente : c.monto) : 0);
    }, 0);
    efectivo = montoPagado;
  } else if (montoPagado === 0 && interesTotal > 0) {
    // Solo interés — no tocar efectivo ni transferencia
  }

  if (montoPagado <= 0 && interesTotal <= 0) { toast('Ingresá el monto cobrado', 'error'); return; }

  // Usar imputación automática cronológica
  const cobro = aplicarImputacion(clienteId, montoPagado, efectivo, transferencia, mora, currentUser.name);
  // Guardar interés por separado — NO sumar a montoEfectivo/montoTransferencia
  cobro.interesEfectivo = interesEfectivo;
  cobro.interesTransferencia = interesTransferencia;
  cobro.interesMora = mora + interesTotal;
  save();
  showResumenCobro(clienteId, cobro);
};

const showResumenCobro = (clienteId, cobro) => {
  const cl = state.clientes.find(c => c.id === clienteId);
  let html = `
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:48px;margin-bottom:12px">✅</div>

      <div style="font-size:14px;color:var(--text2);margin-top:6px">${cl.nombre}</div>
    </div>

const recalcularPlan = (editado) => {
  const capital = Number(document.getElementById('plan-capital')?.value || 0);
  const ncuotas = Number(document.getElementById('plan-ncuotas')?.value || 0);
  const cuota = Number(document.getElementById('plan-cuota')?.value || 0);
  const frecuencia = document.getElementById('plan-frecuencia')?.value || 'LV';
  const tasaSugerida = Number(document.getElementById('plan-capital')?.dataset.tasa || 0);

  if (!capital) return;

  let cuotaFinal = cuota;
  let cuotasFinal = ncuotas;

  if (editado === 'capital' || editado === 'ncuotas') {
    // Recalcular cuota manteniendo la tasa sugerida
    const ncuotasInput = document.getElementById('plan-ncuotas');
    if (capital > 0 && ncuotas > 0 && tasaSugerida > 0) {
      cuotaFinal = Math.round((capital * (1 + tasaSugerida / 100)) / ncuotas);
      document.getElementById('plan-cuota').value = cuotaFinal;
    }
  } else if (editado === 'cuota') {
    // Recalcular cuotas solo si el usuario no las editó manualmente
    const ncuotasInput = document.getElementById('plan-ncuotas');
    if (capital > 0 && cuota > 0 && (!ncuotasInput?.dataset.manual || ncuotasInput.dataset.manual === 'false')) {
      cuotasFinal = Math.round((capital * (1 + tasaSugerida / 100)) / cuota);
      document.getElementById('plan-ncuotas').value = cuotasFinal;
      cuotaFinal = cuota;
    } else {
      cuotaFinal = cuota;
    }
  }

  if (capital > 0 && cuotasFinal > 0 && cuotaFinal > 0) {
    const totalCobrar = cuotasFinal * cuotaFinal;
    const ganancia = totalCobrar - capital;
    const tasaReal = ((ganancia / capital) * 100).toFixed(1);
    const inicio = nextHabil(today(), frecuencia);

    document.getElementById('plan-preview').style.display = 'block';
    document.getElementById('pp-cuotas').textContent = cuotasFinal;
    document.getElementById('pp-total').textContent = formatMoney(totalCobrar);
    document.getElementById('pp-ganancia').textContent = formatMoney(ganancia);
    document.getElementById('pp-inicio').textContent = formatDate(inicio);

    // Mostrar tasa resultante solo si es admin
    const tasaEl = document.getElementById('pp-tasa');
    if (tasaEl && currentUser.role === 'admin') {
      tasaEl.textContent = `${tasaReal}%`;
    }
  }
};

const calcularCuotaSugerida = () => recalcularPlan('capital');

const toggleOrigenPlan = (tipo) => {
  const tipos = ['ef', 'tr', 'fp'];
  tipos.forEach(t => {
    const btn = document.getElementById('origen-' + t);
    const grp = document.getElementById('plan-' + t + '-group');
    if (!btn) return;
    if (t === tipo) {
      const activo = btn.style.borderColor === 'var(--accent)';
      btn.style.borderColor = activo ? 'var(--border)' : 'var(--accent)';
      btn.style.color = activo ? '' : 'var(--accent)';
      if (grp) grp.style.display = activo ? 'none' : 'block';
      if (activo && grp) { const inp = grp.querySelector('input'); if (inp) inp.value = ''; }
    }
  });
  syncPlanEntrega();
};

const syncPlanEntrega = () => {
  const ef = Number(document.getElementById('plan-ef')?.value || 0);
  const tr = Number(document.getElementById('plan-tr')?.value || 0);
  const fp = Number(document.getElementById('plan-fp')?.value || 0);
  const capital = Number(document.getElementById('plan-capital')?.value || 0);
  const hint = document.getElementById('plan-entrega-hint');
  if (!hint) return;
  const total = ef + tr + fp;
  if (capital > 0 && total > 0) {
    const diff = total - capital;
    if (Math.abs(diff) < 1) {
      hint.textContent = 'Total: ' + formatMoney(total) + ' ✓';
      hint.style.color = 'var(--accent)';
    } else {
      hint.textContent = 'Total: ' + formatMoney(total) + ' · Falta: ' + formatMoney(capital - total);
      hint.style.color = 'var(--warn)';
    }
  } else {
    hint.textContent = '';
  }
};

const confirmarNuevoPlan = (clienteId) => {
  const capital = Number(document.getElementById('plan-capital').value);
  const cuota = Number(document.getElementById('plan-cuota').value);
  const ncuotas = Number(document.getElementById('plan-ncuotas').value);
  const frecuencia = document.getElementById('plan-frecuencia').value;
  const obs = document.getElementById('plan-obs').value;
  const efectivoEntregado = Number(document.getElementById('plan-ef')?.value || 0);
  const transferenciaEntregada = Number(document.getElementById('plan-tr')?.value || 0);
  const fondosPropios = Number(document.getElementById('plan-fp')?.value || 0);

  if (!capital || !cuota || !ncuotas) { toast('Ingresá capital, cuota y cantidad de cuotas', 'error'); return; }

  // Validar origen obligatorio
  const totalOrigen = efectivoEntregado + transferenciaEntregada + fondosPropios;
  if (totalOrigen === 0) { toast('Indicá de dónde sale el capital', 'error'); return; }
  if (Math.abs(totalOrigen - capital) > 1) { toast('El total del origen debe coincidir con el capital (' + formatMoney(capital) + ')', 'error'); return; }

  // Validar saldo disponible
  const cl = state.clientes.find(c => c.id === clienteId);
  const saldoActual = calcularSaldoTeorico(cl.cartera);
  if (efectivoEntregado > 0 && efectivoEntregado > saldoActual.saldoEfectivo) {
    toast('Sin saldo suficiente en efectivo. Disponible: ' + formatMoney(saldoActual.saldoEfectivo), 'error'); return;
  }
  if (transferenciaEntregada > 0 && transferenciaEntregada > saldoActual.saldoTransferencia) {
    toast('Sin saldo suficiente en transferencia. Disponible: ' + formatMoney(saldoActual.saldoTransferencia), 'error'); return;
  }
  const fechaInput = document.getElementById('plan-fecha-inicio')?.value;
  const inicio = fechaInput || nextHabil(today(), frecuencia);
  const totalCuotas = ncuotas;
  const tasa = (((cuota * totalCuotas) - capital) / capital * 100).toFixed(2);

  const plan = {
    id: uid(), clienteId, cartera: cl.cartera,
    capital, valorCuota: cuota, totalCuotas, cuotaActual: 1,
    fechaInicio: inicio, frecuencia, estado: 'activo',
    tasaAplicada: tasa, observaciones: obs,
    efectivoEntregado, transferenciaEntregada, fondosPropios
  };

  state.planes.push(plan);
  const cuotas = generarCuotas(plan);
  state.cuotas.push(...cuotas);

  save();
  toast('Plan creado correctamente');
  navigate(() => showCliente(clienteId));
};

const calcularPreviewRenovacion = (clienteId, planId) => {

  const planAnterior = state.planes.find(p => p.id === planId);

  const ncuotasInput = document.getElementById('ren-ncuotas');
  const cuotaInput = document.getElementById('ren-cuota');
  const ncuotasManual = ncuotasInput?.dataset.manual === 'true';
  const cuotaManual = cuotaInput?.dataset.manual === 'true';

  let ncuotas = Number(ncuotasInput?.value || planAnterior?.totalCuotas || 20);
  let cuota = Number(cuotaInput?.value || 0);

  if (capital > 0 && tasa > 0) {
    const totalAPagar = capital * (1 + tasa / 100);

    // Siempre actualizar el hint con la cuota sugerida para las cuotas actuales

      if (cuotaInput) { cuotaInput.value = cuota; cuotaInput.placeholder = cuota; }

      ncuotas = Math.round(totalAPagar / cuota);
      if (ncuotasInput) ncuotasInput.value = ncuotas;
    }

  if (!capital) return;
  const calc = calcularRenovacion(planId, clienteId, capital);

  const inicio = nextHabil(today(), frecuencia);
  const preview = document.getElementById('ren-preview');
  const confirmBtn = document.getElementById('ren-confirm-btn');

  preview.innerHTML = `
    <div class="resumen-box" style="margin:16px 0">
      <div class="resumen-row">
        <span class="resumen-label">
          Plan a renovar (${calc.cuotasRestantes} cuotas restantes)<br>
          <span style="font-size:11px;color:var(--text3)">Capital ${formatMoney(calc.planARenovar.capital)}</span>
        </span>
        <span class="resumen-value danger">− ${formatMoney(calc.descuentoPlanRenovar)}</span>
      </div>
      ${calc.otrosPlanes.map(op => `
        <div class="resumen-row">
          <span class="resumen-label">

            <span style="font-size:11px;color:var(--text3)">${op.detalle}</span>
          </span>
          <span class="resumen-value danger">− ${formatMoney(op.cuota)}</span>
        </div>
      `).join('')}

const ejecutarRenovacion = (clienteId, planId) => {
  const capital = Number(document.getElementById('ren-capital')?.value || 0);
  const cuota = Number(document.getElementById('ren-cuota')?.value || 0);
  const ncuotas = Number(document.getElementById('ren-ncuotas')?.value || 0);
  const frecuencia = document.getElementById('ren-frecuencia')?.value || 'LV';

  if (!capital || !cuota || !ncuotas) { toast('Completá todos los campos', 'error'); return; }

  const calc = APP.calcularRenovacion(planId, clienteId, capital);
  if (!calc) return;

  // Mostrar modal para pedir efectivo/transferencia
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">¿Cómo entregás el crédito?</div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:16px">
        Neto a entregar: <strong style="color:var(--accent)">${formatMoney(calc.netoEntregar)}</strong>
      </div>
      <div class="stat-grid" style="margin-bottom:16px">
        <div class="input-group" style="margin:0">
          <label class="input-label">Efectivo</label>
          <input type="number" id="ren-ef" placeholder="$0" oninput="syncRenEntrega(${calc.netoEntregar})">
        </div>
        <div class="input-group" style="margin:0">
          <label class="input-label">Transferencia</label>
          <input type="number" id="ren-tr" placeholder="$0" oninput="syncRenEntrega(${calc.netoEntregar})">
        </div>
      </div>
      <div id="ren-entrega-hint" style="font-size:12px;color:var(--text2);margin-bottom:16px"></div>
      <button class="btn btn-warn" onclick="confirmarRenovacionFinal('${clienteId}', '${planId}', ${capital}, ${cuota}, '${frecuencia}', ${ncuotas})">
        🔄 Confirmar renovación
      </button>
      <button class="btn btn-secondary" style="margin-top:8px" onclick="document.getElementById('ren-modal').remove()">Cancelar</button>
    </div>
  `;
  modal.id = 'ren-modal';
  // Pre-cargar todo en efectivo
  document.getElementById('modal-container').appendChild(modal);
  setTimeout(() => {
    const ef = document.getElementById('ren-ef');
    if (ef) { ef.value = calc.netoEntregar; syncRenEntrega(calc.netoEntregar); }
  }, 100);
};

const syncRenEntrega = (neto) => {
  const ef = Number(document.getElementById('ren-ef')?.value || 0);
  const tr = Number(document.getElementById('ren-tr')?.value || 0);
  const hint = document.getElementById('ren-entrega-hint');
  if (hint) {
    const total = ef + tr;
    if (total === neto) hint.textContent = '✅ Total correcto';
    else if (total < neto) hint.textContent = `⚠️ Falta ${formatMoney(neto - total)}`;
    else hint.textContent = `⚠️ Excede por ${formatMoney(total - neto)}`;
  }
};

const confirmarRenovacionFinal = (clienteId, planId, capital, cuota, frecuencia, ncuotas) => {
  const ef = Number(document.getElementById('ren-ef')?.value || 0);
  const tr = Number(document.getElementById('ren-tr')?.value || 0);
  const calc = APP.calcularRenovacion(planId, clienteId, capital);
  if (!calc) return;

  // Validar que el total entregado sea exactamente el neto
  const total = ef + tr;
  if (Math.abs(total - calc.netoEntregar) > 1) {
    toast(`El total debe ser ${formatMoney(calc.netoEntregar)}. Diferencia: ${formatMoney(total - calc.netoEntregar)}`, 'error');
    return;
  }

  // Validar saldo disponible
  const clRen = state.clientes.find(c => c.id === clienteId);
  const saldoRen = calcularSaldoTeorico(clRen.cartera);
  if (ef > 0 && ef > saldoRen.saldoEfectivo) {
    toast('Sin saldo suficiente en efectivo. Disponible: ' + formatMoney(saldoRen.saldoEfectivo), 'error'); return;
  }
  if (tr > 0 && tr > saldoRen.saldoTransferencia) {
    toast('Sin saldo suficiente en transferencia. Disponible: ' + formatMoney(saldoRen.saldoTransferencia), 'error'); return;
  }

  document.getElementById('ren-modal')?.remove();

  const resultado = confirmarRenovacion(planId, clienteId, capital, cuota, frecuencia, currentUser.name, ncuotas, ef, tr);
  if (resultado) {
    toast('Renovación confirmada ✓');
    navigate(() => showCliente(clienteId));
  }
};

const showGastos = (tabActivo = 'gastos', fechaSeleccionada = null) => {
  const isAdmin = currentUser.role === 'admin';
  const cartera = isAdmin ? null : currentUser.cartera;
  const carteraPropia = currentUser.cartera;
  const hoy = today();
  const fecha = fechaSeleccionada || hoy;

  let html = `
    <div class="tabs">
      <button class="tab ${tabActivo === 'gastos' ? 'active' : ''}" onclick="showGastos('gastos')">💸 Gastos</button>
      <button class="tab ${tabActivo === 'midia' ? 'active' : ''}" onclick="showGastos('midia')">📊 Mi día</button>
      <button class="tab ${tabActivo === 'historial' ? 'active' : ''}" onclick="showGastos('historial', '${fecha}')">📅 Historial</button>
    </div>
  `;

  if (tabActivo === 'gastos') {
    const gastos = state.gastos.filter(g => !cartera || g.cartera === cartera).slice(-30).reverse();
    html += `<button class="btn btn-primary" style="margin-bottom:16px" onclick="showNuevoGasto()">+ Registrar gasto</button>
    <div class="section-title">Últimos gastos</div>`;

    if (gastos.length === 0) {
      html += `<div class="empty-state"><div class="empty-icon">💸</div><div class="empty-text">Sin gastos registrados</div></div>`;
    } else {
      gastos.forEach(g => {
        const total = (g.montoEfectivo || 0) + (g.montoTransferencia || 0);
        html += `
          <div class="card" style="padding:12px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:14px;font-weight:500">${g.descripcion}</div>
                <div style="font-size:12px;color:var(--text2);margin-top:2px">${formatDate(g.fecha)} · ${g.cartera === 'julieta' ? 'Julieta' : 'Jorge'}</div>
              </div>
              <div style="font-family:var(--mono);font-size:15px;color:var(--danger)">−${formatMoney(total)}</div>
            </div>
            ${g.montoEfectivo && g.montoTransferencia ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">Ef: ${formatMoney(g.montoEfectivo)} · Tr: ${formatMoney(g.montoTransferencia)}</div>` : ''}
          </div>
        `;
      });
    }

  } else if (tabActivo === 'midia') {
    if (isAdmin) {
      const carteras = ['julieta', 'jorge'];
      const carteraSeleccionada = window._dashCarteraGastos || 'julieta';
      html += `
        <div class="tabs" style="margin-bottom:12px">
          ${carteras.map(c => `<button class="tab ${carteraSeleccionada === c ? 'active' : ''}" onclick="window._dashCarteraGastos='${c}'; showGastos('midia')">${c === 'julieta' ? 'Julieta' : 'Jorge'}</button>`).join('')}
        </div>
      `;
      html += renderResumenDia(carteraSeleccionada, hoy);
    } else {
      html += renderResumenDia(carteraPropia, hoy);
    }

  } else {
    // ===== HISTORIAL =====
    const cartaraActual = carteraPropia;
    const fechaAnterior = addDays(fecha, -1);
    const fechaSiguiente = addDays(fecha, 1);
    const esFuturo = fechaSiguiente > hoy;

    html += `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <button class="btn btn-secondary btn-sm" onclick="showGastos('historial', '${fechaAnterior}')">←</button>
        <div style="text-align:center">
          <div style="font-size:16px;font-weight:600">${formatDate(fecha)}</div>
          <div style="font-size:12px;color:var(--text2)">${fecha === hoy ? 'Hoy' : ''}</div>
        </div>
        <button class="btn btn-secondary btn-sm" onclick="showGastos('historial', '${fechaSiguiente}')" ${esFuturo ? 'disabled style="opacity:0.3"' : ''}>→</button>
      </div>
    `;

    html += renderResumenDia(cartaraActual, fecha);
  }

  render(html, 'Gastos');
};

const renderResumenDia = (cartera, fecha) => {
  const s = calcularSaldoTeoricoFecha(cartera, fecha);
  const cobrosdia = state.cobros.filter(c => c.fecha === fecha && !c.esVirtual && c.cartera === cartera);
  const gastosdia = state.gastos.filter(g => g.fecha === fecha && g.cartera === cartera);
  const renovacionesdia = state.renovaciones.filter(r => r.fecha === fecha && r.cartera === cartera);
  const creditosNuevosdia = state.planes.filter(p => p.fechaInicio === fecha && p.cartera === cartera && (p.efectivoEntregado > 0 || p.transferenciaEntregada > 0 || p.fondosPropios > 0));

  const cobradoEf = cobrosdia.reduce((s, c) => s + (c.montoEfectivo || 0) + (c.interesMora || 0), 0);
  const cobradoTr = cobrosdia.reduce((s, c) => s + (c.montoTransferencia || 0), 0);
  const renEf = renovacionesdia.reduce((s, r) => s + (r.efectivoEntregado || 0), 0);
  const renTr = renovacionesdia.reduce((s, r) => s + (r.transferenciaEntregada || 0), 0);
  const renVirtual = renovacionesdia.reduce((s, r) => s + (r.totalDescuento || 0), 0);
  const creditosNuevosEf = creditosNuevosdia.reduce((s, p) => s + (p.efectivoEntregado || 0), 0);
  const creditosNuevosTr = creditosNuevosdia.reduce((s, p) => s + (p.transferenciaEntregada || 0), 0);
  const creditosNuevosFP = creditosNuevosdia.reduce((s, p) => s + (p.fondosPropios || 0), 0);
  const gastosEf = gastosdia.reduce((s, g) => s + (g.montoEfectivo || 0), 0);
  const gastosTr = gastosdia.reduce((s, g) => s + (g.montoTransferencia || 0), 0);
  // Fondos propios: neto 0 en saldo (entra y sale en el mismo momento)
  const saldoHoyEf = cobradoEf - renEf - creditosNuevosEf - gastosEf;
  const saldoHoyTr = cobradoTr - renTr - creditosNuevosTr - gastosTr;

  let html = `
    <div class="card" style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.6px">Ingresos</div>
      <div class="resumen-row"><span class="resumen-label">✅ Cobros efectivo</span><span class="resumen-value accent">+${formatMoney(cobradoEf)}</span></div>
      <div class="resumen-row"><span class="resumen-label">✅ Cobros transferencia</span><span class="resumen-value accent">+${formatMoney(cobradoTr)}</span></div>
      ${renVirtual > 0 ? `<div class="resumen-row"><span class="resumen-label" style="color:var(--accent2)">🔄 Cuotas saldadas x renovación</span><span class="resumen-value" style="color:var(--accent2)">+${formatMoney(renVirtual)}</span></div>` : ''}
      ${creditosNuevosFP > 0 ? `<div class="resumen-row"><span class="resumen-label" style="color:var(--accent2)">💼 Fondos propios Jorge</span><span class="resumen-value" style="color:var(--accent2)">+${formatMoney(creditosNuevosFP)}</span></div>` : ''}
    </div>

    <div class="card" style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:700;color:var(--danger);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.6px">Egresos</div>
      ${renEf > 0 ? `<div class="resumen-row"><span class="resumen-label">🔄 Renovación efectivo</span><span class="resumen-value danger">−${formatMoney(renEf)}</span></div>` : ''}
      ${renTr > 0 ? `<div class="resumen-row"><span class="resumen-label">🔄 Renovación transf.</span><span class="resumen-value danger">−${formatMoney(renTr)}</span></div>` : ''}
      ${creditosNuevosEf > 0 ? `<div class="resumen-row"><span class="resumen-label">💳 Crédito nuevo efectivo</span><span class="resumen-value danger">−${formatMoney(creditosNuevosEf)}</span></div>` : ''}
      ${creditosNuevosTr > 0 ? `<div class="resumen-row"><span class="resumen-label">💳 Crédito nuevo transf.</span><span class="resumen-value danger">−${formatMoney(creditosNuevosTr)}</span></div>` : ''}
      ${creditosNuevosFP > 0 ? `<div class="resumen-row"><span class="resumen-label">💼 Crédito nuevo fondos propios</span><span class="resumen-value danger">−${formatMoney(creditosNuevosFP)}</span></div>` : ''}
      ${gastosdia.map(g => `
        <div class="resumen-row">
          <span class="resumen-label">💸 ${g.descripcion}</span>
          <span class="resumen-value danger">−${formatMoney((g.montoEfectivo||0)+(g.montoTransferencia||0))}</span>
        </div>
      `).join('')}
      ${gastosdia.length === 0 && renEf === 0 && renTr === 0 && creditosNuevosEf === 0 && creditosNuevosTr === 0 && creditosNuevosFP === 0 ? `<div style="font-size:13px;color:var(--text3)">Sin egresos</div>` : ''}
    </div>

    <div class="section-title">Resultado del día</div>
    <div class="stat-grid" style="margin-bottom:16px">
      <div class="stat-card">
        <div class="stat-label">💵 Efectivo</div>
        <div class="stat-value ${saldoHoyEf >= 0 ? 'accent' : 'danger'}">${saldoHoyEf >= 0 ? '+' : ''}${formatMoney(saldoHoyEf)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🏦 Transferencia</div>
        <div class="stat-value ${saldoHoyTr >= 0 ? 'accent' : 'danger'}">${saldoHoyTr >= 0 ? '+' : ''}${formatMoney(saldoHoyTr)}</div>
      </div>
    </div>

    <div class="section-title">Saldo acumulado al cierre</div>
    <div class="stat-grid">
      <div class="stat-card" style="border-color:rgba(0,212,170,0.3)">
        <div class="stat-label">💵 Efectivo total</div>
        <div class="stat-value accent">${formatMoney(s.saldoEfectivo)}</div>
      </div>
      <div class="stat-card" style="border-color:rgba(0,212,170,0.3)">
        <div class="stat-label">🏦 Transferencia total</div>
        <div class="stat-value accent">${formatMoney(s.saldoTransferencia)}</div>
      </div>
    </div>
  `;
  return html;
};

const recargarDatos = async () => {
  try {
    toast('Actualizando...');
    // Intentar conectar Firebase si no está conectado
    if (!window._syncReady) {
      if (window.initFirebaseSync) await window.initFirebaseSync();
    }
    const db = firebase.firestore();
    const snap = await db.collection('pec_cobros').doc('data').get();
    if (snap.exists) {
      const data = snap.data();
      const cierresIniciales = (APP.state.cierres || []).filter(c => c.esSaldoInicial || (c.id && c.id.includes('inicial')));
      Object.assign(APP.state, data);
      cierresIniciales.forEach(ci => {
        if (!APP.state.cierres.some(c => c.id === ci.id)) APP.state.cierres.push(ci);
      });
      localStorage.setItem('prestamos_data', JSON.stringify(APP.state));
      showHome();
      toast('✅ Datos actualizados');
    } else {
      toast('Sin datos en Firebase', 'error');
    }
  } catch(e) {
    console.error('Error recargar:', e);
    toast('Error: ' + e.message, 'error');
  }
};

const eliminarCobro = (cobroId, clienteId) => {
  if (!confirm('¿Eliminar este cobro? Las cuotas volverán a estado pendiente.')) return;
  
  const cobro = state.cobros.find(c => c.id === cobroId);
  if (!cobro) return;

  // Revertir cuotas al estado correcto
  (cobro.imputacion || []).forEach(imp => {
    const cuota = state.cuotas.find(c => c.id === imp.cuotaId);
    if (cuota) {
      // saldoAnterior = cuánto debía la cuota ANTES de este cobro
      // imp.parcial = true si este cobro no alcanzó a cubrirla completamente
      const saldoAnterior = imp.saldoAnterior;
      
      if (imp.parcial) {
        // Este cobro fue parcial: la cuota sigue parcial con el saldo que tenía antes
        cuota.estado = 'parcial';
        cuota.saldoPendiente = saldoAnterior !== undefined ? saldoAnterior : cuota.monto;
        cuota.fechaPago = null;
        // Restar lo que se había cobrado en este pago
        const montoAplicado = imp.montoImputado || imp.montoAplicado || 0;
        cuota.cobradoEfectivo = Math.max(0, (cuota.cobradoEfectivo || 0) - montoAplicado);
        cuota.montoPagado = Math.max(0, (cuota.montoPagado || 0) - montoAplicado);
      } else if (saldoAnterior !== undefined && saldoAnterior < cuota.monto) {
        // Este cobro completó una cuota que YA era parcial → volver a parcial
        cuota.estado = 'parcial';
        cuota.saldoPendiente = saldoAnterior;
        cuota.fechaPago = null;
        const montoAplicado = imp.montoImputado || saldoAnterior || 0;
        cuota.cobradoEfectivo = Math.max(0, (cuota.cobradoEfectivo || 0) - montoAplicado);
        cuota.montoPagado = Math.max(0, cuota.monto - saldoAnterior);
      } else {
        // Cuota completa estaba pendiente → volver a pendiente
        cuota.estado = 'pendiente';
        cuota.fechaPago = null;
        cuota.cobradoEfectivo = 0;
        cuota.cobradoTransferencia = 0;
        cuota.saldoPendiente = undefined;
        cuota.montoPagado = 0;
      }
    }
  });

  // Revertir planes cancelados si corresponde
  const planesCliente = state.planes.filter(p => p.clienteId === clienteId && p.estado === 'cancelado');
  planesCliente.forEach(plan => {
    const tienePendientes = state.cuotas.some(c => c.planId === plan.id && c.estado === 'pendiente');
    if (tienePendientes) {
      plan.estado = 'activo';
      plan.fechaCancelacion = null;
    }
  });

  state.cobros = state.cobros.filter(c => c.id !== cobroId);
  save();
  toast('Cobro eliminado ✓');
  // Recargar pantalla del cliente
  navStack = navStack.filter((_, i) => i === 0);
  showCliente(clienteId);
};

// ===== HISTORIAL DE PAGOS POR CLIENTE (solo admin) =====
const showHistorialCliente = (clienteId) => {
  const cl = state.clientes.find(c => c.id === clienteId);
  const cobros = state.cobros.filter(c => c.clienteId === clienteId && !c.esVirtual).sort((a, b) => b.fecha.localeCompare(a.fecha));
  const cuotas = state.cuotas.filter(c => c.clienteId === clienteId);
  const hoy = today();

  // Calcular estadísticas
  const totalCuotas = cuotas.length;
  const cuotasPagadas = cuotas.filter(c => c.estado === 'pagada').length;
  const cuotasVencidas = cuotas.filter(c => c.estado === 'pendiente' && c.fecha < hoy).length;
  const totalCobrado = cobros.reduce((s, c) => s + c.montoPagado, 0);
  const totalMora = cobros.reduce((s, c) => s + (c.interesMora || 0), 0);
  
  // Promedio días de mora
  const cobrosConMora = cobros.filter(c => c.interesMora > 0);
  const vecesAtrasado = cobrosConMora.length;
  
  // Calcular puntaje de buen pagador
  const pctPagado = totalCuotas > 0 ? (cuotasPagadas / totalCuotas) * 100 : 0;
  let puntaje, color, emoji;
  if (pctPagado >= 95 && vecesAtrasado === 0) { puntaje = 'Excelente'; color = 'var(--accent)'; emoji = '⭐'; }
  else if (pctPagado >= 80 && vecesAtrasado <= 2) { puntaje = 'Bueno'; color = 'var(--accent)'; emoji = '👍'; }
  else if (pctPagado >= 60) { puntaje = 'Regular'; color = 'var(--warn)'; emoji = '⚠️'; }
  else { puntaje = 'Malo'; color = 'var(--danger)'; emoji = '❌'; }

  let html = `
    <div class="section-title">Resumen del cliente</div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Comportamiento</div>
        <div style="font-size:20px;font-weight:700;color:${color}">${emoji} ${puntaje}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cuotas pagadas</div>
        <div class="stat-value accent">${cuotasPagadas} / ${totalCuotas}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Cuotas vencidas</div>
        <div class="stat-value ${cuotasVencidas > 0 ? 'danger' : ''}">${cuotasVencidas}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Veces con mora</div>
        <div class="stat-value ${vecesAtrasado > 0 ? 'warn' : ''}">${vecesAtrasado}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total cobrado</div>
        <div class="stat-value">${formatMoney(totalCobrado)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total mora pagada</div>
        <div class="stat-value warn">${formatMoney(totalMora)}</div>
      </div>
    </div>

    <div class="section-title">Historial de cobros</div>
  `;

  if (cobros.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">💸</div><div class="empty-text">Sin cobros registrados</div></div>`;
  } else {
    cobros.forEach(c => {
      html += `
        <div class="card" style="padding:12px;margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <div style="font-size:13px;font-weight:500">${formatDate(c.fecha)}</div>
              <div style="font-size:12px;color:var(--text2);margin-top:3px">
                Ef: ${formatMoney(c.montoEfectivo)} · Tr: ${formatMoney(c.montoTransferencia)}
                ${c.interesMora > 0 ? ` <span style="color:var(--warn)">· Mora: ${formatMoney(c.interesMora)}</span>` : ''}
              </div>
              <div style="font-size:11px;color:var(--text3);margin-top:2px">
                ${(c.imputacion || []).map(imp => {
                  const plan = state.planes.find(p => p.id === imp.planId);
                  return `Cuota ${imp.numeroCuota} · ${formatMoney(plan?.capital)}${imp.vencida ? ' ⚠️' : ''}`;
                }).join(' | ')}
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="font-family:var(--mono);font-size:14px;color:var(--accent)">${formatMoney(c.montoPagado)}</div>
              <button class="btn btn-danger btn-sm" style="padding:4px 8px;font-size:11px" onclick="eliminarCobro('${c.id}','${clienteId}')">🗑️</button>
            </div>
          </div>
        </div>
      `;
    });
  }

  render(html, `Historial — ${cl.nombre}`, '', true);
};

// ===== ALERTA CLIENTES SIN ACTIVIDAD =====
const getClientesSinActividad = (cartera, diasInactividad = 3) => {
  const hoy = today();
  const clientesCartera = state.clientes.filter(c => c.cartera === cartera && c.activo !== false);
  
  return clientesCartera.filter(cl => {
    const planesActivos = state.planes.filter(p => p.clienteId === cl.id && p.estado === 'activo');
    if (planesActivos.length === 0) return false;
    
    // Último cobro del cliente
    const cobros = state.cobros.filter(c => c.clienteId === cl.id && !c.esVirtual);
    if (cobros.length === 0) {
      // Nunca cobró — ver si debería tener cuotas
      const cuotasVencidas = state.cuotas.filter(c => c.clienteId === cl.id && c.fecha < hoy && c.estado === 'pendiente');
      return cuotasVencidas.length > 0;
    }
    
    const ultimoCobro = cobros.sort((a, b) => b.fecha.localeCompare(a.fecha))[0];
    const diasDesdeUltimoCobro = Math.round((new Date(hoy+'T12:00:00') - new Date(ultimoCobro.fecha+'T12:00:00')) / 86400000);
    
    // Solo alertar si tiene cuotas vencidas
    const cuotasVencidas = state.cuotas.filter(c => c.clienteId === cl.id && c.fecha < hoy && c.estado === 'pendiente');
    return diasDesdeUltimoCobro >= diasInactividad && cuotasVencidas.length > 0;
  }).map(cl => {
    const cobros = state.cobros.filter(c => c.clienteId === cl.id && !c.esVirtual);
    const ultimoCobro = cobros.length > 0 ? cobros.sort((a, b) => b.fecha.localeCompare(a.fecha))[0] : null;
    const cuotasVencidas = state.cuotas.filter(c => c.clienteId === cl.id && c.fecha < hoy && c.estado === 'pendiente');
    const deudaTotal = cuotasVencidas.reduce((s, c) => s + (c.saldoPendiente || c.monto), 0);
    const dias = ultimoCobro ? Math.round((new Date(hoy+'T12:00:00') - new Date(ultimoCobro.fecha+'T12:00:00')) / 86400000) : 999;
    return { cl, ultimoCobro, dias, cuotasVencidas: cuotasVencidas.length, deudaTotal };
  }).sort((a, b) => b.dias - a.dias);
};

// ===== BACKUP EXCEL =====
const exportarBackupExcel = () => {
  try {
    const hoy = today();
    
    // Crear CSV de cada tabla
    const csvClientes = [
      'ID,Nombre,DNI,Telefono,Direccion,Cartera,FechaAlta',
      ...state.clientes.map(c => `${c.id},"${c.nombre}","${c.dni||''}","${c.telefono||''}","${c.direccion||''}",${c.cartera},${c.fechaAlta}`)
    ].join('\n');
    
    const csvPlanes = [
      'ID,Cliente,Cartera,Capital,Cuota,TotalCuotas,Inicio,Frecuencia,Estado,Tasa',
      ...state.planes.map(p => {
        const cl = state.clientes.find(c => c.id === p.clienteId);
        return `${p.id},"${cl?.nombre||''}",${p.cartera},${p.capital},${p.valorCuota},${p.totalCuotas},${p.fechaInicio},${p.frecuencia},${p.estado},${p.tasaAplicada}`;
      })
    ].join('\n');

    const csvCobros = [
      'ID,Cliente,Fecha,Monto,Efectivo,Transferencia,Mora',
      ...state.cobros.filter(c => !c.esVirtual).map(c => {
        const cl = state.clientes.find(x => x.id === c.clienteId);
        return `${c.id},"${cl?.nombre||''}",${c.fecha},${c.montoPagado},${c.montoEfectivo||0},${c.montoTransferencia||0},${c.interesMora||0}`;
      })
    ].join('\n');

    const csvGastos = [
      'ID,Cartera,Fecha,Descripcion,Efectivo,Transferencia',
      ...state.gastos.map(g => `${g.id},${g.cartera},${g.fecha},"${g.descripcion}",${g.montoEfectivo||0},${g.montoTransferencia||0}`)
    ].join('\n');

    // Crear HTML con múltiples hojas simuladas
    const contenido = `BACKUP PEC COBROS - ${hoy}\n\n=== CLIENTES ===\n${csvClientes}\n\n=== PLANES ===\n${csvPlanes}\n\n=== COBROS ===\n${csvCobros}\n\n=== GASTOS ===\n${csvGastos}`;
    
    const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup_pec_${hoy}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    
    toast('Backup descargado ✓');
  } catch(e) {
    toast('Error al generar backup', 'error');
  }
};
